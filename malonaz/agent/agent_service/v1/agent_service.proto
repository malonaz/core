// Request message for AgentService.ResolveApproval.
message ResolveApprovalRequest {
  // The resource name of the task whose approval is being resolved.
  // Format: organizations/{organization}/users/{user}/agents/{agent}/tasks/{task}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.malonaz.com/Task"
  ];

  // The id of the pending tool call being resolved.
  string tool_call_id = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // If true, execute the tool call; otherwise decline it.
  bool approved = 3;

  // Optional reason returned to the model as the tool result when declining.
  string decline_reason = 4;
}

