syntax = "proto3";

package malonaz.scheduler.scheduler_service.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/scheduler/scheduler_service/v1/job.proto";
import "malonaz/scheduler/scheduler_service/v1/queue.proto";
import "malonaz/scheduler/scheduler_service/v1/target.proto";
import "malonaz/scheduler/v1/job.proto";
import "malonaz/scheduler/v1/queue.proto";
import "malonaz/scheduler/v1/target.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/scheduler_service/v1";

// This API represents a scheduler service: a durable, Postgres-backed job
// queue that delivers each job's payload to a handler over gRPC.
//
// # Resource model
//
// - [Target][malonaz.scheduler.v1.Target] resources are the gRPC servers the
//   scheduler dials.
//   Format: targets/{target}
// - [Queue][malonaz.scheduler.v1.Queue] resources hold an execution policy and
//   the handlers (method on a target) jobs are routed to.
//   Format: queues/{queue}
// - [Job][malonaz.scheduler.v1.Job] resources are system-wide at the root, or
//   hang off the organization or user they run on behalf of.
//   Format: jobs/{job}
//   Format: organizations/{organization}/jobs/{job}
//   Format: organizations/{organization}/users/{user}/jobs/{job}
//
// # Scheduling
//
// A job is due at its `schedule_time` (at creation when unset). Due jobs of
// RUNNING queues are claimed highest `priority` first, then in due order,
// across every parent, within each queue's `max_concurrency`. A job with an
// `expire_time` must have started by then: it fails with DEADLINE_EXCEEDED if
// still PENDING at expiry, and a retry whose backoff would reach past it fails
// at once. A `unique_key` coalesces work: at most one PENDING and one RUNNING
// job exist per key, so a burst of keyed creates yields one run plus, if one
// was in flight, a single trailing run.
//
// # Delivery
//
// At creation, a job's payload type URL selects the handler of its queue it is
// delivered to. Workers claim due PENDING jobs, invoke the handler's method on
// its target with the payload as request body under the queue's attempt
// timeout, and record the outcome: SUCCEEDED with the response, or PENDING
// again with the next attempt scheduled after the backoff, or FAILED with the
// error once attempts are exhausted or the error is not retryable. A handler
// may attach a `google.rpc.RetryInfo` detail to its error to set the wait
// before the next attempt. Every attempt is recorded in the job's `metadata`.
//
// Every handler call carries the job's resource name in the `x-scheduler-job`
// request metadata, which handlers pass to ReportJobProgress.
//
// A running job holds a lease that its worker renews while the call is in
// flight; jobs whose lease lapses (crashed worker) are returned to PENDING.
//
// Terminal jobs are kept for the scheduler's retention and deleted at their
// `purge_time`.
service SchedulerService {
  option (google.api.default_host) = "scheduler.malonaz.com";

  // ===================== Target Management =====================

  // Create a target.
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateTarget(CreateTargetRequest) returns (scheduler.v1.Target) {
    option (google.api.http) = {
      post: "/v1/targets"
      body: "target"
    };
    option (google.api.method_signature) = "target";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // Get a target.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetTarget(GetTargetRequest) returns (scheduler.v1.Target) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{name=targets/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // Update a target. Jobs routed to it after the update use the new
  // endpoint; calls in flight complete on the old one.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateTarget(UpdateTargetRequest) returns (scheduler.v1.Target) {
    option (google.api.http) = {
      patch: "/v1/{target.name=targets/*}"
      body: "target"
    };
    option (google.api.method_signature) = "target,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // Delete a target. Fails with FAILED_PRECONDITION while a queue handler
  // references it.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteTarget(DeleteTargetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=targets/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // List targets.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/targets"};
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // Get multiple targets in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetTargets(BatchGetTargetsRequest) returns (BatchGetTargetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/targets:batchGet"};
    option (google.api.method_signature) = "names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Target";
  }

  // ===================== Queue Management =====================

  // Create a queue. Every handler's method must be present in the scheduler's
  // descriptor set and its target must exist; no two handlers may share a
  // request type. The queue starts RUNNING.
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateQueue(CreateQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/queues"
      body: "queue"
    };
    option (google.api.method_signature) = "queue";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Get a queue.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetQueue(GetQueueRequest) returns (scheduler.v1.Queue) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{name=queues/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Update a queue. The new policy applies to attempts claimed after the
  // update; the new handlers apply to jobs created after it.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateQueue(UpdateQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      patch: "/v1/{queue.name=queues/*}"
      body: "queue"
    };
    option (google.api.method_signature) = "queue,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Delete a queue. Fails with FAILED_PRECONDITION while a PENDING or RUNNING
  // job references it.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteQueue(DeleteQueueRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=queues/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // List queues.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/queues"};
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Get multiple queues in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetQueues(BatchGetQueuesRequest) returns (BatchGetQueuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/queues:batchGet"};
    option (google.api.method_signature) = "names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Pause a queue: no further job of it is claimed until it is resumed;
  // running jobs finish and new jobs are accepted. Idempotent on a PAUSED
  // queue.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc PauseQueue(PauseQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/{name=queues/*}:pause"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Resume a paused queue. Idempotent on a RUNNING queue.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc ResumeQueue(ResumeQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/{name=queues/*}:resume"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // ===================== Job Management =====================

  // Create a job in its queue. Fails with NOT_FOUND when the queue does not
  // exist and with INVALID_ARGUMENT when no handler of the queue accepts the
  // payload type. A job on a PAUSED queue is accepted and waits. When the job
  // carries a `unique_key` that already has a PENDING job, no job is created
  // and that job is returned instead.
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateJob(CreateJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "job"
      additional_bindings: {
        post: "/v1/{parent=organizations/*}/jobs"
        body: "job"
      }
      additional_bindings: {
        post: "/v1/{parent=organizations/*/users/*}/jobs"
        body: "job"
      }
    };
    option (google.api.method_signature) = "parent,job";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Get a job.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetJob(GetJobRequest) returns (scheduler.v1.Job) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/{name=jobs/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/jobs/*}"}
      additional_bindings: {get: "/v1/{name=organizations/*/users/*/jobs/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Update a job.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateJob(UpdateJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      patch: "/v1/{job.name=jobs/*}"
      body: "job"
      additional_bindings: {
        patch: "/v1/{job.name=organizations/*/jobs/*}"
        body: "job"
      }
      additional_bindings: {
        patch: "/v1/{job.name=organizations/*/users/*/jobs/*}"
        body: "job"
      }
    };
    option (google.api.method_signature) = "job,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Delete a job. A RUNNING job must be cancelled first.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=jobs/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/jobs/*}"}
      additional_bindings: {delete: "/v1/{name=organizations/*/users/*/jobs/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // List jobs.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/jobs"
      additional_bindings: {get: "/v1/{parent=organizations/*}/jobs"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/jobs"}
    };
    option (google.api.method_signature) = "parent";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Get multiple jobs in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetJobs(BatchGetJobsRequest) returns (BatchGetJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/jobs:batchGet"
      additional_bindings: {get: "/v1/{parent=organizations/*}/jobs:batchGet"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/jobs:batchGet"}
    };
    option (google.api.method_signature) = "parent,names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Retry a terminal job: returns it to PENDING with its attempts, outcome and
  // `expire_time` reset, so it runs again immediately. Fails with
  // FAILED_PRECONDITION on a PENDING or RUNNING job, and with ALREADY_EXISTS
  // when the job's `unique_key` already has a PENDING job.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc RetryJob(RetryJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:retry"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:retry"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:retry"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Cancel a job. A PENDING job is cancelled at once; a RUNNING job is marked
  // CANCELLED and its in-flight processor call is cancelled on a best-effort
  // basis. Fails with FAILED_PRECONDITION on a terminal job.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc CancelJob(CancelJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:cancel"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:cancel"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:cancel"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Report the progress of a RUNNING job. Processors call this with the job
  // name received in the `x-scheduler-job` metadata. Fails with
  // FAILED_PRECONDITION once the job is no longer running, which lets a
  // processor notice a cancellation.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc ReportJobProgress(ReportJobProgressRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:reportProgress"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:reportProgress"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:reportProgress"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name,progress";
  }
}
