syntax = "proto3";

package malonaz.scheduler.scheduler_service.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/scheduler/scheduler_service/v1/job.proto";
import "malonaz/scheduler/scheduler_service/v1/queue.proto";
import "malonaz/scheduler/scheduler_service/v1/schedule.proto";
import "malonaz/scheduler/v1/job.proto";
import "malonaz/scheduler/v1/queue.proto";
import "malonaz/scheduler/v1/schedule.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/scheduler_service/v1";

// This API represents a scheduler service: a durable, Postgres-backed job
// queue that delivers each job's payload to a gRPC method.
//
// # Resource model
//
// - [Queue][malonaz.scheduler.v1.Queue] resources are the methods jobs are
//   delivered to, each with its endpoint and execution policy. The dispatcher
//   creates them from the methods it discovers over its endpoints' gRPC
//   reflection; clients read, pause and resume them.
//   Format: queues/{queue}
// - [Job][malonaz.scheduler.v1.Job] resources are system-wide at the root, or
//   hang off the organization or user they run on behalf of.
//   Format: jobs/{job}
//   Format: organizations/{organization}/jobs/{job}
//   Format: organizations/{organization}/users/{user}/jobs/{job}
// - [Schedule][malonaz.scheduler.v1.Schedule] resources declare recurring
//   work: a cron expression and a payload template from which one job is
//   created per tick, under the schedule's parent.
//   Format: schedules/{schedule}
//   Format: organizations/{organization}/schedules/{schedule}
//   Format: organizations/{organization}/users/{user}/schedules/{schedule}
//
// # Scheduling
//
// A job is due at its `schedule_time` (at creation when unset). Due jobs of
// RUNNING queues are claimed highest `priority` first, then in due order,
// across every parent, within each queue's `max_concurrency`. A job with an
// `expire_time` must have started by then: it fails with DEADLINE_EXCEEDED if
// still PENDING at expiry, and a retry whose backoff would reach past it fails
// at once. A `unique_key` coalesces work: at most one PENDING and one RUNNING
// job exist per key, so a burst of keyed creates yields one run plus, if one
// was in flight, a single trailing run.
//
// # Delivery
//
// At creation, a job's payload type URL selects its queue. The dispatcher
// claims due PENDING jobs, invokes the queue's method on its endpoint with the
// payload as request body under the queue's attempt timeout, and records the
// outcome: SUCCEEDED with the response, or PENDING again with the next attempt
// scheduled after the backoff, or FAILED with the error once attempts are
// exhausted or the error is not retryable. A method may attach a
// `google.rpc.RetryInfo` detail to its error to set the wait before the next
// attempt. Every attempt is recorded in the job's `metadata`.
//
// Every call carries the job's resource name in the `x-scheduler-job` request
// metadata, which methods pass to ReportJobProgress.
//
// # Recurrence
//
// An ENABLED schedule is due at its `next_schedule_time`. At each tick the
// scheduler creates the job the schedule describes — `schedule_time` the
// tick, `expire_time` the tick plus the schedule's `run_window` (the next
// tick when unset), labelled `scheduler.malonaz.com/schedule` — and advances
// `next_schedule_time` to the first cron occurrence after now. A tick reached
// after its run window closed is skipped and counted in `missed_tick_count`:
// downtime is never caught up. A tick's job is created idempotently, so a
// pass interrupted after the insert replays into the same job.
//
// # Long-running operations
//
// A job of a method whose response type is `google.longrunning.Operation`
// (AIP-151) is an operation, named `{parent}/operations/{job}`. The method must return
// it done: its `response` or `error` is recorded as the job's outcome, and an
// unfinished operation fails the job with FAILED_PRECONDITION without retry.
// `WaitJob` backs `WaitOperation`.
//
// A running job holds a lease that the dispatcher renews while the call is in
// flight; jobs whose lease lapses (crashed dispatcher) are returned to PENDING.
//
// Terminal jobs are kept for the scheduler's retention and deleted at their
// `purge_time`.
service SchedulerService {
  option (google.api.default_host) = "scheduler.malonaz.com";

  // ===================== Queue Management =====================

  // Create a queue. No two queues may share a request type. The queue starts
  // RUNNING. Meant for the dispatcher, which creates one per method it
  // discovers; see [Queue][malonaz.scheduler.v1.Queue].
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateQueue(CreateQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/queues"
      body: "queue"
    };
    option (google.api.method_signature) = "queue";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Get a queue.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetQueue(GetQueueRequest) returns (scheduler.v1.Queue) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{name=queues/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Update a queue. The new policy and endpoint apply to attempts claimed
  // after the update.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateQueue(UpdateQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      patch: "/v1/{queue.name=queues/*}"
      body: "queue"
    };
    option (google.api.method_signature) = "queue,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Delete a queue. Fails with FAILED_PRECONDITION while a PENDING or RUNNING
  // job references it.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteQueue(DeleteQueueRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=queues/*}"};
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // List queues.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/queues"};
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Get multiple queues in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetQueues(BatchGetQueuesRequest) returns (BatchGetQueuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/queues:batchGet"};
    option (google.api.method_signature) = "names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Queue";
  }

  // Pause a queue: no further job of it is claimed until it is resumed;
  // running jobs finish and new jobs are accepted. Idempotent on a PAUSED
  // queue.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc PauseQueue(PauseQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/{name=queues/*}:pause"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Resume a paused queue. Idempotent on a RUNNING queue.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc ResumeQueue(ResumeQueueRequest) returns (scheduler.v1.Queue) {
    option (google.api.http) = {
      post: "/v1/{name=queues/*}:resume"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // ===================== Job Management =====================

  // Create a job in the queue its payload type selects. Fails with
  // FAILED_PRECONDITION when no queue accepts the payload type. A job on a
  // PAUSED queue is accepted and waits. When the job carries a `unique_key`
  // that already has a PENDING job, no job is created and that job is returned
  // instead.
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateJob(CreateJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "job"
      additional_bindings: {
        post: "/v1/{parent=organizations/*}/jobs"
        body: "job"
      }
      additional_bindings: {
        post: "/v1/{parent=organizations/*/users/*}/jobs"
        body: "job"
      }
    };
    option (google.api.method_signature) = "parent,job";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Get a job.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetJob(GetJobRequest) returns (scheduler.v1.Job) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/{name=jobs/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/jobs/*}"}
      additional_bindings: {get: "/v1/{name=organizations/*/users/*/jobs/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Update a job.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateJob(UpdateJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      patch: "/v1/{job.name=jobs/*}"
      body: "job"
      additional_bindings: {
        patch: "/v1/{job.name=organizations/*/jobs/*}"
        body: "job"
      }
      additional_bindings: {
        patch: "/v1/{job.name=organizations/*/users/*/jobs/*}"
        body: "job"
      }
    };
    option (google.api.method_signature) = "job,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Delete a job. A RUNNING job must be cancelled first.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=jobs/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/jobs/*}"}
      additional_bindings: {delete: "/v1/{name=organizations/*/users/*/jobs/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // List jobs.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/jobs"
      additional_bindings: {get: "/v1/{parent=organizations/*}/jobs"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/jobs"}
    };
    option (google.api.method_signature) = "parent";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Get multiple jobs in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetJobs(BatchGetJobsRequest) returns (BatchGetJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/jobs:batchGet"
      additional_bindings: {get: "/v1/{parent=organizations/*}/jobs:batchGet"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/jobs:batchGet"}
    };
    option (google.api.method_signature) = "parent,names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Job";
  }

  // Retry a terminal job: returns it to PENDING with its attempts, outcome and
  // `expire_time` reset, so it runs again immediately. Fails with
  // FAILED_PRECONDITION on a PENDING or RUNNING job, and with ALREADY_EXISTS
  // when the job's `unique_key` already has a PENDING job.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc RetryJob(RetryJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:retry"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:retry"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:retry"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Cancel a job. A PENDING job is cancelled at once; a RUNNING job is marked
  // CANCELLED and its in-flight processor call is cancelled on a best-effort
  // basis. Fails with FAILED_PRECONDITION on a terminal job.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc CancelJob(CancelJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:cancel"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:cancel"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:cancel"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Wait for a job to reach a terminal state, or for the timeout to elapse,
  // whichever comes first, and return it as it is then. Timing out is not an
  // error: callers inspect `state`. The timeout is capped by the server; see
  // [WaitJobRequest.timeout][malonaz.scheduler.scheduler_service.v1.WaitJobRequest.timeout].
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc WaitJob(WaitJobRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:wait"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:wait"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:wait"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name,timeout";
  }

  // Report the progress of a RUNNING job. Processors call this with the job
  // name received in the `x-scheduler-job` metadata. Fails with
  // FAILED_PRECONDITION once the job is no longer running, which lets a
  // processor notice a cancellation.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc ReportJobProgress(ReportJobProgressRequest) returns (scheduler.v1.Job) {
    option (google.api.http) = {
      post: "/v1/{name=jobs/*}:reportProgress"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/jobs/*}:reportProgress"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/jobs/*}:reportProgress"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name,progress";
  }

  // ===================== Schedule Management =====================

  // Create a schedule in the queue its payload type selects. Fails with
  // INVALID_ARGUMENT when no queue accepts the payload type, when `cron` is
  // not a five-field cron expression, or when `time_zone` is not an IANA
  // zone. The schedule starts ENABLED with `next_schedule_time` at the first
  // occurrence after now.
  //
  // See: https://google.aip.dev/133 (Standard methods: Create).
  rpc CreateSchedule(CreateScheduleRequest) returns (scheduler.v1.Schedule) {
    option (google.api.http) = {
      post: "/v1/schedules"
      body: "schedule"
      additional_bindings: {
        post: "/v1/{parent=organizations/*}/schedules"
        body: "schedule"
      }
      additional_bindings: {
        post: "/v1/{parent=organizations/*/users/*}/schedules"
        body: "schedule"
      }
    };
    option (google.api.method_signature) = "parent,schedule";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // Get a schedule.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetSchedule(GetScheduleRequest) returns (scheduler.v1.Schedule) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/{name=schedules/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/schedules/*}"}
      additional_bindings: {get: "/v1/{name=organizations/*/users/*/schedules/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // Update a schedule. Changing `cron` or `time_zone` recomputes
  // `next_schedule_time` from now; jobs already created are untouched.
  //
  // See: https://google.aip.dev/134 (Standard methods: Update).
  rpc UpdateSchedule(UpdateScheduleRequest) returns (scheduler.v1.Schedule) {
    option (google.api.http) = {
      patch: "/v1/{schedule.name=schedules/*}"
      body: "schedule"
      additional_bindings: {
        patch: "/v1/{schedule.name=organizations/*/schedules/*}"
        body: "schedule"
      }
      additional_bindings: {
        patch: "/v1/{schedule.name=organizations/*/users/*/schedules/*}"
        body: "schedule"
      }
    };
    option (google.api.method_signature) = "schedule,update_mask";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // Delete a schedule. Jobs it already created are untouched.
  //
  // See: https://google.aip.dev/135 (Standard methods: Delete).
  rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=schedules/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/schedules/*}"}
      additional_bindings: {delete: "/v1/{name=organizations/*/users/*/schedules/*}"}
    };
    option (google.api.method_signature) = "name";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // List schedules.
  //
  // See: https://google.aip.dev/132 (Standard methods: List).
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/schedules"
      additional_bindings: {get: "/v1/{parent=organizations/*}/schedules"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/schedules"}
    };
    option (google.api.method_signature) = "parent";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // Get multiple schedules in a single request.
  //
  // See: https://google.aip.dev/231 (Batch methods: Get).
  rpc BatchGetSchedules(BatchGetSchedulesRequest) returns (BatchGetSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/schedules:batchGet"
      additional_bindings: {get: "/v1/{parent=organizations/*}/schedules:batchGet"}
      additional_bindings: {get: "/v1/{parent=organizations/*/users/*}/schedules:batchGet"}
    };
    option (google.api.method_signature) = "parent,names";
    option (malonaz.codegen.aip.v1.standard_method).resource = "scheduler.malonaz.com/Schedule";
  }

  // Pause a schedule: no tick is materialized until it is resumed, and
  // `next_schedule_time` is cleared. Jobs already created are untouched.
  // Idempotent on a PAUSED schedule.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc PauseSchedule(PauseScheduleRequest) returns (scheduler.v1.Schedule) {
    option (google.api.http) = {
      post: "/v1/{name=schedules/*}:pause"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/schedules/*}:pause"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/schedules/*}:pause"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Resume a paused schedule from the first occurrence after now: ticks that
  // fell within the pause are not caught up. Idempotent on an ENABLED
  // schedule.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc ResumeSchedule(ResumeScheduleRequest) returns (scheduler.v1.Schedule) {
    option (google.api.http) = {
      post: "/v1/{name=schedules/*}:resume"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/schedules/*}:resume"
        body: "*"
      }
      additional_bindings: {
        post: "/v1/{name=organizations/*/users/*/schedules/*}:resume"
        body: "*"
      }
    };
    option (google.api.method_signature) = "name";
  }
}
