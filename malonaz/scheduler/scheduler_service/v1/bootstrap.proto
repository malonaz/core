syntax = "proto3";

package malonaz.scheduler.scheduler_service.v1;

import "buf/validate/validate.proto";
import "malonaz/scheduler/scheduler_service/v1/queue.proto";
import "malonaz/scheduler/scheduler_service/v1/target.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/scheduler_service/v1";

// Bootstrap declares the targets and queues a scheduler deployment converges
// onto at startup: each entry is created if absent and updated if its
// client-writable fields differ. Nothing is ever deleted and a queue's state
// is left as it is. Every entry names its resource; request ids are derived
// from the id so replicas booting concurrently replay the same create.
message Bootstrap {
  option (buf.validate.message).cel = {
    id: "bootstrap.targets_identified"
    message: "every target must set target_id and leave request_id and validate_only unset"
    expression: "this.targets.all(t, t.target_id != '' && t.request_id == '' && !t.validate_only)"
  };
  option (buf.validate.message).cel = {
    id: "bootstrap.queues_identified"
    message: "every queue must set queue_id and leave request_id and validate_only unset"
    expression: "this.queues.all(q, q.queue_id != '' && q.request_id == '' && !q.validate_only)"
  };

  // The targets to converge onto, before the queues.
  repeated CreateTargetRequest targets = 1;

  // The queues to converge onto; their handlers may route to the targets above.
  repeated CreateQueueRequest queues = 2;
}
