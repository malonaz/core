syntax = "proto3";

package malonaz.scheduler.scheduler_service.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/scheduler/v1/schedule.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/scheduler_service/v1";

// Request message for SchedulerService.CreateSchedule.
message CreateScheduleRequest {
  // The parent resource, which every job the schedule creates lives under.
  // Empty for a system schedule.
  // Format: organizations/{organization}
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [(google.api.resource_reference).child_type = "scheduler.malonaz.com/Schedule"];

  // The schedule to create. Only the producer-owned fields are read:
  // `payload`, `cron`, `time_zone`, `priority`, `run_window`, `labels`.
  scheduler.v1.Schedule schedule = 2 [(buf.validate.field).required = true];

  // The ID to use for the resource, which will become the final component of
  // the resource name.
  // This value should be 1-63 characters, and valid characters
  // are /[a-z][0-9]-/.
  string schedule_id = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-z0-9](-?[a-z0-9])*$"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // A unique identifier for this request. Must be a UUID. Repeating a request
  // with the same ID returns the schedule it created instead of creating another.
  string request_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // If set, validate the request and preview the response, but do not actually create the resource.
  bool validate_only = 5;
}

// Request message for SchedulerService.GetSchedule.
message GetScheduleRequest {
  // The resource name of the schedule to retrieve.
  // Format: schedules/{schedule}
  // Format: organizations/{organization}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "scheduler.malonaz.com/Schedule"
  ];
}

// Request message for SchedulerService.UpdateSchedule.
message UpdateScheduleRequest {
  option (malonaz.codegen.aip.v1.update) = {
    paths: [
      "labels",
      "cron",
      "time_zone",
      "priority",
      "run_window"
    ]
  };
  option (buf.validate.message).cel = {
    id: "schedule.name_required"
    message: "schedule.name must be set"
    expression: "has(this.schedule.name)"
  };

  // The schedule to update. Changing `cron` or `time_zone` recomputes
  // `next_schedule_time` from now.
  scheduler.v1.Schedule schedule = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

// Request message for SchedulerService.DeleteSchedule.
message DeleteScheduleRequest {
  // The resource name of the schedule to delete.
  // Format: schedules/{schedule}
  // Format: organizations/{organization}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "scheduler.malonaz.com/Schedule"
  ];

  // If true, and the schedule is not found, the request will succeed
  // but no action will be taken on the server.
  bool allow_missing = 2;

  // If set, the request will only succeed if the current etag matches this value.
  string etag = 3;
}

// Request message for SchedulerService.ListSchedules.
message ListSchedulesRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: [
      "create_time",
      "next_schedule_time"
    ]
    default: "create_time desc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The parent to list schedules under. Empty lists system schedules; the
  // wildcard `-` lists across parents (e.g. `organizations/-` for every
  // organization's schedules).
  // Format: organizations/{organization}
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [(google.api.resource_reference).child_type = "scheduler.malonaz.com/Schedule"];

  // @autogen.
  string filter = 2;

  // @autogen.
  string order_by = 3;

  // Maximum number of schedules to return (max 1000).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // A page token, received from a previous `ListSchedules` call.
  string page_token = 5;
}

// Response message for SchedulerService.ListSchedules.
message ListSchedulesResponse {
  // The list of schedules.
  repeated scheduler.v1.Schedule schedules = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request message for SchedulerService.BatchGetSchedules.
message BatchGetSchedulesRequest {
  // The parent shared by every requested schedule. Optional; when set, every
  // name must be a direct child of it.
  // Format: organizations/{organization}
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [(google.api.resource_reference).child_type = "scheduler.malonaz.com/Schedule"];

  // The resource names of the schedules to retrieve.
  // Format: schedules/{schedule}
  // Format: organizations/{organization}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  // A maximum of 1000 schedules can be retrieved in a batch.
  repeated string names = 2 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 1000
      unique: true
      items: {
        string: {min_len: 1}
      }
    },
    (google.api.resource_reference).type = "scheduler.malonaz.com/Schedule"
  ];
}

// Response message for SchedulerService.BatchGetSchedules.
message BatchGetSchedulesResponse {
  // Schedules requested.
  repeated scheduler.v1.Schedule schedules = 1;
}

// Request message for SchedulerService.PauseSchedule.
message PauseScheduleRequest {
  // The resource name of the schedule to pause.
  // Format: schedules/{schedule}
  // Format: organizations/{organization}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "scheduler.malonaz.com/Schedule"
  ];

  // If set, the request will only succeed if the current etag matches this value.
  string etag = 2;
}

// Request message for SchedulerService.ResumeSchedule.
message ResumeScheduleRequest {
  // The resource name of the schedule to resume.
  // Format: schedules/{schedule}
  // Format: organizations/{organization}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "scheduler.malonaz.com/Schedule"
  ];

  // If set, the request will only succeed if the current etag matches this value.
  string etag = 2;
}
