syntax = "proto3";

package malonaz.scheduler.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";
import "malonaz/scheduler/policy/v1/policy.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/v1";

// A Queue is one gRPC method the scheduler delivers jobs to, with the policy
// its jobs run under. Queues are not declared by hand: the dispatcher reflects
// every endpoint it is given and creates or updates a queue for each method
// carrying a `malonaz.codegen.scheduler.v1.method` annotation, so the policy
// lives next to the method. A job is routed to the queue whose
// `request_type` is its payload's type.
//
// Pausing a queue stops new claims: running jobs finish, pending jobs wait.
// A queue cannot be deleted while a non-terminal job references it.
message Queue {
  option (google.api.resource) = {
    type: "scheduler.malonaz.com/Queue"
    pattern: "queues/{queue}"
    singular: "queue"
    plural: "queues"
  };
  option (malonaz.codegen.model.v1.model_opts) = {schema_name: "scheduler"};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "0b0bf9b6-d8ee-40c0-8483-7b245c19afec";

  // The resource name of the queue.
  // Format: queues/{queue}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the queue.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the queue.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A checksum computed by the server based on the current value of the resource.
  // Can be sent in update and delete requests to ensure the client has an
  // up-to-date value before proceeding.
  string etag = 4;

  // Whether the queue's jobs are being claimed. RUNNING on creation; changed
  // through PauseQueue and ResumeQueue.
  QueueState state = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // The fully qualified name of the gRPC service serving the method, e.g.
  // `engine.engine_service.v1.EngineService`.
  string service = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]*(\\.[a-zA-Z_][a-zA-Z0-9_]*)+$"
  ];

  // The name of the method within the service, e.g. `AnalyzeBook`. One queue
  // per (service, method).
  string method = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"
  ];

  // The gRPC endpoint serving the method: `unix:` path, `http(s)://` or
  // `host:port`, as the dispatcher dials it.
  string endpoint = 8 [(buf.validate.field).required = true];

  // The type URL of the method's request, e.g.
  // `type.googleapis.com/engine.engine_service.v1.AnalyzeBookRequest`. Jobs
  // whose payload has this type URL are routed here; no two queues share one.
  string request_type = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^type\\.googleapis\\.com/[^/]+$"
  ];

  // The type URL of the method's response, which job responses are stored under.
  string response_type = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^type\\.googleapis\\.com/[^/]+$"
  ];

  // The execution policy of every job in the queue.
  policy.v1.QueuePolicy policy = 11 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (buf.validate.field).required = true
  ];

  // The queue's backlog, computed when the queue is read.
  QueueStats stats = 12 [
    (malonaz.codegen.model.v1.field_opts).skip = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// The backlog of a queue.
message QueueStats {
  // The number of PENDING jobs.
  int32 pending_count = 1;

  // The number of RUNNING jobs.
  int32 running_count = 2;

  // The earliest due time among PENDING jobs: the schedule time, or the
  // creation time of a job without one. Unset when nothing is pending.
  google.protobuf.Timestamp oldest_pending_schedule_time = 3;
}

// Whether a queue's jobs are being claimed.
enum QueueState {
  // Used to detect an unset field.
  QUEUE_STATE_UNSPECIFIED = 0;

  // Due jobs are claimed and run.
  QUEUE_STATE_RUNNING = 1;

  // No job is claimed; running jobs finish and pending jobs wait.
  QUEUE_STATE_PAUSED = 2;
}
