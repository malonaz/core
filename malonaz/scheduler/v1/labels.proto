syntax = "proto3";

package malonaz.scheduler.v1;

import "malonaz/codegen/aip/v1/label.proto";

option go_package = "github.com/malonaz/core/genproto/scheduler/v1";
option (malonaz.codegen.aip.v1.label) = {
  key: "scheduler.malonaz.com/retried"
  values: ["true"]
  description: "Set by RetryJob when a FAILED or CANCELLED job is manually returned to PENDING. Distinguishes operator intervention from the scheduler's own attempt retries, which never set it. While set, every attempt is recorded as manual and a failed one is final rather than retried under the queue's policy. Filter `labels.\"scheduler.malonaz.com/retried\" = \"true\"` lists every job that needed a hand."
};
