syntax = "proto3";

package malonaz.workspace.workspace_manager_service.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/workspace_manager_service/v1";

// Request message for WorkspaceManagerService.OpenTerminal.
message OpenTerminalRequest {
  // Content of this request.
  oneof content {
    option (buf.validate.oneof).required = true;

    // The terminal to open. Must be sent first, and only once.
    TerminalConfiguration configuration = 1;

    // Bytes typed into the terminal.
    bytes stdin = 2 [(buf.validate.field).bytes.max_len = 65536];

    // The terminal's new size.
    TerminalSize resize = 3;
  }
}

// Configuration for a terminal. Sent as the first message.
message TerminalConfiguration {
  // The workspace to open a terminal in.
  // Format: organizations/{organization}/users/{user}/workspaces/{workspace}
  string workspace = 1 [
    (buf.validate.field).required = true,
    (google.api.resource_reference).type = "workspace.malonaz.com/Workspace"
  ];

  // The terminal's initial size.
  TerminalSize size = 2 [(buf.validate.field).required = true];
}

// The size of a terminal, in characters.
message TerminalSize {
  // The number of columns.
  uint32 columns = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];

  // The number of rows.
  uint32 rows = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
}

// Response message for WorkspaceManagerService.OpenTerminal.
message OpenTerminalResponse {
  // Content of this response.
  oneof content {
    option (buf.validate.oneof).required = true;

    // Bytes the terminal printed, stdout and stderr together as on a PTY.
    bytes stdout = 1;

    // The shell's exit code, the stream's last message.
    int32 exit_code = 2;
  }
}
