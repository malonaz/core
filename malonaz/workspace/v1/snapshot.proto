syntax = "proto3";

package malonaz.workspace.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/v1";

// A Snapshot is a LOCAL filesystem's state at one point, usually an agent's
// turn end, and what changed since the snapshot before it. Immutable; deleted
// with its filesystem.
message Snapshot {
  option (google.api.resource) = {
    type: "workspace.malonaz.com/Snapshot"
    pattern: "organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}"
    singular: "snapshot"
    plural: "snapshots"
  };
  option (malonaz.codegen.model.v1.model_opts) = {schema_name: "workspace"};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "8a518fce-716d-4875-a9d0-fb9842f49573";

  // Trigger is what took a snapshot.
  enum Trigger {
    // Used to detect an unset field.
    TRIGGER_UNSPECIFIED = 0;
    // A turn ended, named in `turn`.
    TRIGGER_TURN = 1;
    // The workspace writing it sat idle with no turn end signalled.
    TRIGGER_IDLE = 2;
    // The workspace writing it stopped.
    TRIGGER_STOP = 3;
  }

  // The resource name of the snapshot. Its id is assigned by the server, in
  // increasing order.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the snapshot.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What took the snapshot.
  Trigger trigger = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The turn the snapshot ends, an id opaque to the service. Set only for TRIGGER_TURN.
  string turn = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.max_len = 256
  ];

  // The bytes the snapshot added to storage: what changed since the one before.
  int64 size_bytes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths, relative to the filesystem's root, created since the snapshot before.
  repeated string added = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths whose content or mode changed since the snapshot before.
  repeated string changed = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths deleted since the snapshot before.
  repeated string deleted = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}
