syntax = "proto3";

package malonaz.workspace.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/v1";

// A Filesystem is a directory tree workspaces mount: it owns the files and
// their history, and outlives every workspace mounting it. Stored as a
// Kubernetes object; a LOCAL filesystem's snapshots live in object storage.
message Filesystem {
  option (google.api.resource) = {
    type: "workspace.malonaz.com/Filesystem"
    pattern: "organizations/{organization}/users/{user}/filesystems/{filesystem}"
    singular: "filesystem"
    plural: "filesystems"
  };

  // Kind is where a filesystem's files live, which decides its speed and writers.
  enum Kind {
    // Used to detect an unset field.
    KIND_UNSPECIFIED = 0;
    // On the disk of the node running its writer, snapshotted to object storage:
    // fast for git, package managers and builds, with a history. One read-write
    // mount at a time.
    KIND_LOCAL = 1;
    // On a network filesystem every node mounts: any number of read-write mounts
    // at once, last write wins, a network round trip per small-file operation.
    // No per-turn history. For small files shared across sessions.
    KIND_SHARED = 2;
  }

  // The resource name of the filesystem.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the filesystem.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the filesystem.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A checksum computed by the server based on the current value of the resource.
  string etag = 4;

  // The labels on this filesystem.
  map<string, string> labels = 5 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
    }
    values: {
      string: {
        max_len: 63
        pattern: "^[a-z0-9_\\-\\p{L}]*$"
      }
    }
  }];

  // Where the filesystem's files live.
  Kind kind = 6 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The most bytes the filesystem may hold. A full LOCAL filesystem fails writes
  // with ENOSPC; an over-quota SHARED one is mounted read-only until it shrinks.
  // Defaults to the server's quota for its kind.
  int64 quota_bytes = 7 [(buf.validate.field).int64.gte = 0];

  // The bytes the filesystem holds, as last measured.
  int64 used_bytes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The workspace holding the filesystem's one read-write mount. LOCAL only;
  // empty while no workspace writes it.
  // Format: organizations/{organization}/users/{user}/workspaces/{workspace}
  string writer = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "workspace.malonaz.com/Workspace"
  ];

  // The filesystem's latest snapshot. LOCAL only; empty until the first.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}
  string latest_snapshot = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "workspace.malonaz.com/Snapshot"
  ];
}

// A Snapshot is a LOCAL filesystem's state at one point, usually an agent's
// turn end, and what changed since the snapshot before it. Immutable; deleted
// with its filesystem.
message Snapshot {
  option (google.api.resource) = {
    type: "workspace.malonaz.com/Snapshot"
    pattern: "organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}"
    singular: "snapshot"
    plural: "snapshots"
  };

  // Trigger is what took a snapshot.
  enum Trigger {
    // Used to detect an unset field.
    TRIGGER_UNSPECIFIED = 0;
    // A turn ended, named in `turn`.
    TRIGGER_TURN = 1;
    // The workspace writing it sat idle with no turn end signalled.
    TRIGGER_IDLE = 2;
    // The workspace writing it stopped.
    TRIGGER_STOP = 3;
  }

  // The resource name of the snapshot. Its id is assigned by the server, in
  // increasing order.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the snapshot.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What took the snapshot.
  Trigger trigger = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The turn the snapshot ends, an id opaque to the service. Set only for TRIGGER_TURN.
  string turn = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.max_len = 256
  ];

  // The bytes the snapshot added to storage: what changed since the one before.
  int64 size_bytes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths, relative to the filesystem's root, created since the snapshot before. Only in the FULL view.
  repeated string added = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths whose content or mode changed since the snapshot before. Only in the FULL view.
  repeated string changed = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The paths deleted since the snapshot before. Only in the FULL view.
  repeated string deleted = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SnapshotView is how much of a snapshot a read returns.
enum SnapshotView {
  // Used to detect an unset field: BASIC for lists, FULL for gets.
  SNAPSHOT_VIEW_UNSPECIFIED = 0;
  // Everything but the changed paths.
  SNAPSHOT_VIEW_BASIC = 1;
  // Everything, the changed paths included.
  SNAPSHOT_VIEW_FULL = 2;
}
