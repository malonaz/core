syntax = "proto3";

package malonaz.workspace.filesystem_service.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/workspace/v1/snapshot.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/filesystem_service/v1";

// Request message for FilesystemService.CreateSnapshot.
message CreateSnapshotRequest {
  // The LOCAL filesystem to snapshot.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "workspace.malonaz.com/Filesystem"
  ];

  // The snapshot to take. Only `trigger` and `turn` are read; its id is assigned by the server.
  malonaz.workspace.v1.Snapshot snapshot = 2 [(buf.validate.field).required = true];

  // A unique identifier for this request. Must be a UUID. Repeating a request
  // with the same ID returns the operation it started instead of starting another.
  string request_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Request message for FilesystemService.GetSnapshot.
message GetSnapshotRequest {
  // The snapshot to retrieve.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}/snapshots/{snapshot}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "workspace.malonaz.com/Snapshot"
  ];
}

// Request message for FilesystemService.ListSnapshots.
message ListSnapshotsRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: ["create_time"]
    default: "create_time desc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The filesystem whose snapshots to list.
  // Format: organizations/{organization}/users/{user}/filesystems/{filesystem}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "workspace.malonaz.com/Filesystem"
  ];

  // @autogen.
  string filter = 2;

  // @autogen
  string order_by = 3;

  // Maximum number of snapshots to return (max 100).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // A page token, received from a previous `ListSnapshots` call.
  string page_token = 5;
}

// Response message for FilesystemService.ListSnapshots.
message ListSnapshotsResponse {
  // The snapshots.
  repeated malonaz.workspace.v1.Snapshot snapshots = 1;

  // A token to retrieve the next page. Omitted when there are no more pages.
  string next_page_token = 2;
}
