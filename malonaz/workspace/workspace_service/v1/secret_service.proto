syntax = "proto3";

package malonaz.workspace.workspace_service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/workspace_service/v1";

// This API puts secrets in one workspace's shells. The workspace manager calls
// it on a running pod; it is never an agent tool.
service SecretService {
  option (google.api.default_host) = "workspace.malonaz.com";

  // Replace every secret the workspace holds: a file per secret under
  // `/run/workspace/secrets` and its env var in `/run/workspace/env`, which
  // every shell sources. An empty list removes them all.
  rpc SetSecrets(SetSecretsRequest) returns (SetSecretsResponse) {
    option (google.api.http) = {
      post: "/v1/workspace:setSecrets"
      body: "*"
    };
  }
}

// A Secret is a value a workspace's shells can read, never stored.
message Secret {
  // The secret's file name under `/run/workspace/secrets`.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 63
      pattern: "^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$"
    }
  ];

  // The env var holding the secret in every shell. Empty for a file only.
  string env_var = 2 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^([A-Z_][A-Z0-9_]*)?$"
  }];

  // The secret's value.
  bytes value = 3 [
    debug_redact = true,
    (buf.validate.field).bytes.max_len = 65536
  ];
}

// Request message for SecretService.SetSecrets.
message SetSecretsRequest {
  // The secrets, replacing every one the workspace holds.
  repeated Secret secrets = 1 [(buf.validate.field).repeated.max_items = 64];
}

// Response message for SecretService.SetSecrets.
message SetSecretsResponse {}
