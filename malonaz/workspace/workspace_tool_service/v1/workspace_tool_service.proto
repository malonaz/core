syntax = "proto3";

package malonaz.workspace.workspace_tool_service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/resource.proto";
import "malonaz/workspace/workspace_service/v1/workspace_service.proto";

option go_package = "github.com/malonaz/core/genproto/workspace/workspace_tool_service/v1";

// This API runs an agent's WorkspaceService calls in a named workspace: the
// server agents call resolves which workspace a call is for and forwards it
// here, where it reaches the workspace's pod. It knows nothing about users or
// agents.
service WorkspaceToolService {
  option (google.api.default_host) = "workspace.malonaz.com";

  // Run a command in a workspace, as WorkspaceService.Exec, waiting within
  // the call's deadline for its pod to be ready. A stopped workspace is
  // started first, with no secrets: StartWorkspace it to give it some.
  // NOT_FOUND for a workspace that does not exist.
  rpc Exec(ExecRequest) returns (malonaz.workspace.workspace_service.v1.ExecResponse) {
    option (google.api.http) = {
      post: "/v1/{workspace=organizations/*/users/*/workspaces/*}:exec"
      body: "*"
    };
  }
}

// Request message for WorkspaceToolService.Exec.
message ExecRequest {
  // The workspace to run in.
  // Format: organizations/{organization}/users/{user}/workspaces/{workspace}
  string workspace = 1 [
    (buf.validate.field).required = true,
    (google.api.resource_reference).type = "workspace.malonaz.com/Workspace"
  ];

  // The command, as the agent called it.
  malonaz.workspace.workspace_service.v1.ExecRequest exec = 2 [(buf.validate.field).required = true];
}
