syntax = "proto3";

package malonaz.ai.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/ai/v1/tool.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";

option go_package = "github.com/malonaz/core/genproto/ai/v1";

// A ToolCall is a call a generation made to a tool: what was called, with what, and its result once a message brings
// it. Its id is its position among its message's tool calls, from 1. Written by the AI service alone, with the message
// making the call, and settled with the message bringing its result. Pending calls are `NOT result:*`.
message ToolCall {
  option (google.api.resource) = {
    type: "ai.malonaz.com/ToolCall"
    pattern: "organizations/{organization}/users/{user}/chats/{chat}/messages/{message}/toolCalls/{tool_call}"
    singular: "toolCall"
    plural: "toolCalls"
  };
  // The resource id is the call's position; `tool_call_id` is the provider's id, as ToolResult names it.
  option (malonaz.codegen.model.v1.model_opts) = {id_column_name: "position"};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "2d8e4b71-9c35-4a0f-8e6b-5f1a37c9d204";

  // The resource name of the tool call.
  // Format: organizations/{organization}/users/{user}/chats/{chat}/messages/{message}/toolCalls/{tool_call}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the tool call: its message's.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the tool call.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The deletion timestamp of the tool call: set with its message's.
  google.protobuf.Timestamp delete_time = 4 [
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // A checksum computed by the server based on the current value of the resource.
  string etag = 5;

  // The labels on this tool call.
  map<string, string> labels = 6 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
      }
      values: {
        string: {
          max_len: 63
          pattern: "^[a-z0-9_\\-\\p{L}]*$"
        }
      }
    }
  ];

  // Annotations populated from the tool that created this tool call.
  map<string, string> annotations = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // Name of the tool called.
  string tool_name = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ID of the tool call, as the provider gave it: its result names it.
  string tool_call_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The arguments the tool was called with.
  google.protobuf.Struct arguments = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true
  ];

  // The result of the call: unset while pending. A call the generation answered itself (a discovery, an unknown
  // tool) has it from the start.
  ToolResult result = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];
}
