syntax = "proto3";

package malonaz.ai.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "malonaz/ai/v1/metrics.proto";
import "malonaz/ai/v1/tool.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";

option go_package = "github.com/malonaz/core/genproto/ai/v1";

// A Message is a single turn within a [Chat][malonaz.ai.v1.Chat].
// It carries the content blocks produced by one participant (system, user,
// assistant or tool), along with the model usage incurred when the message
// was generated by an assistant.
message Message {
  option (google.api.resource) = {
    type: "ai.malonaz.com/Message"
    pattern: "organizations/{organization}/users/{user}/chats/{chat}/messages/{message}"
    singular: "message"
    plural: "messages"
  };
  option (malonaz.codegen.model.v1.model_opts) = {};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "d96e0fa8-568e-420f-bdb2-3c133ef3a50f";
  option (buf.validate.message).cel = {
    id: "system_role_blocks"
    message: "SYSTEM messages can only have text blocks"
    expression: "this.role != 1 || this.blocks.all(b, has(b.text))"
  };
  option (buf.validate.message).cel = {
    id: "assistant_role_blocks"
    message: "ASSISTANT messages can only have thought, text, tool_call, or image blocks"
    expression: "this.role != 2 || this.blocks.all(b, has(b.thought) || has(b.text) || has(b.tool_call) || has(b.image))"
  };
  option (buf.validate.message).cel = {
    id: "user_role_blocks"
    message: "USER messages can only have text or image blocks"
    expression: "this.role != 3 || this.blocks.all(b, has(b.text) || has(b.image))"
  };
  option (buf.validate.message).cel = {
    id: "tool_role_blocks"
    message: "TOOL messages can only have tool_result blocks"
    expression: "this.role != 4 || this.blocks.all(b, has(b.tool_result))"
  };

  // The resource name of the message.
  // Format: organizations/{organization}/users/{user}/chats/{chat}/messages/{message}
  string name = 7 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the message.
  google.protobuf.Timestamp create_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the message.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The deletion timestamp of the message. Set when soft-deleted.
  // Soft-deleted messages are not passed down to the ai providers.
  google.protobuf.Timestamp delete_time = 5 [
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // A checksum computed by the server based on the current value of the resource.
  // Can be sent in update and delete requests to ensure the client has an
  // up-to-date value before proceeding.
  string etag = 9;

  // The labels on this message.
  map<string, string> labels = 6 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
      }
      values: {
        string: {
          max_len: 63
          pattern: "^[a-z0-9_\\-\\p{L}]*$"
        }
      }
    }
  ];

  // Annotations on this message (not transmitted to the ai provider).
  // This should be used by tooling.
  // Values are opaque strings (and may themselves be proto bytes), but keys
  // stay inspectable in storage.
  map<string, string> annotations = 2 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // Role of the message sender.
  Role role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The ordered content blocks of this message.
  repeated Block blocks = 4 [(malonaz.codegen.model.v1.field_opts).as_json_bytes = true];

  // The resource name of the model that generated this message.
  // Only set on assistant messages.
  // Format: providers/{provider}/models/{model}
  string model = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // Model usage incurred generating this message.
  // Only set on assistant messages.
  ModelUsage model_usage = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // Price in dollars of generating this message, summed over `model_usage`.
  // Only set on assistant messages.
  double price = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The error of the generation this message was part of. Set on the input
  // messages of a failed generation (and on a partially generated assistant
  // message, if any). Messages with a status are excluded from the
  // conversation history sent to ai providers.
  google.rpc.Status status = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];
}

// A block of content within a message.
message Block {
  option (buf.validate.message).cel = {
    id: "block_content_required_when_signature_set"
    message: "content is required when signature is set"
    expression: "this.signature == '' || has(this.thought) || has(this.text) || has(this.tool_call) || has(this.partial_tool_call) || has(this.tool_result) || has(this.image)"
  };

  // Index of this block.
  int64 index = 1;

  // A signature for this block.
  string signature = 2;

  // Provider specific extra fields.
  google.protobuf.Struct extra_fields = 3;

  // The content type.
  oneof content {
    // Thought block.
    string thought = 4;

    // Text block.
    string text = 5;

    // Tool call block.
    ToolCall tool_call = 6;

    // Partial tool call block.
    ToolCall partial_tool_call = 7;

    // Tool result block.
    ToolResult tool_result = 8;

    // Image block.
    Image image = 9;
  }
}

// An image block.
message Image {
  option (buf.validate.message).cel = {
    id: "image_requires_media_type_for_data"
    message: "media_type is required when using data"
    expression: "!has(this.data) || this.media_type != ''"
  };

  // The image source.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Raw image bytes.
    bytes data = 1;

    // URL to the image. Supports both HTTPS URLs and data URLs
    // (e.g., "data:image/png;base64,...").
    string url = 2;
  }

  // MIME type of the image (e.g., "image/png", "image/jpeg", "image/webp", "image/gif").
  // Required when using `data`, optional when using `url`.
  string media_type = 3;

  // Quality of the image.
  ImageQuality quality = 4 [(buf.validate.field).enum.defined_only = true];
}

// Represents the level of reasoning effort for AI model responses.
// Controls how many internal reasoning tokens the model generates before
// producing its final response. Higher effort yields more thorough reasoning
// at the cost of increased latency and token usage.
enum ReasoningEffort {
  // Unspecified reasoning effort. Should not be used explicitly.
  REASONING_EFFORT_UNSPECIFIED = 0;

  // Default reasoning effort as configured by the platform.
  REASONING_EFFORT_DEFAULT = 1;

  // Low reasoning effort.
  // Prioritizes speed and token efficiency with minimal internal reasoning.
  // Best for simple, straightforward queries.
  REASONING_EFFORT_LOW = 2;

  // Medium reasoning effort.
  // Balances response speed with reasoning thoroughness.
  // Suitable for most general-purpose queries.
  REASONING_EFFORT_MEDIUM = 3;

  // High reasoning effort.
  // Maximizes reasoning depth and accuracy by generating more thinking tokens.
  // Best for complex problems requiring careful analysis.
  // May result in slower responses and higher token consumption.
  REASONING_EFFORT_HIGH = 4;

  // Extra-high reasoning effort.
  // Extended capability for long-horizon agentic and coding work.
  // Expect meaningfully higher token usage and latency than high.
  REASONING_EFFORT_XHIGH = 5;

  // Maximum reasoning effort.
  // Absolute maximum capability with no constraints on token spending.
  // Reserve for tasks requiring the deepest possible reasoning.
  REASONING_EFFORT_MAX = 6;
}

// Represents the role of a message in a multi-turn AI conversation.
enum Role {
  // Used to detect an unset field.
  ROLE_UNSPECIFIED = 0;
  // System message.
  ROLE_SYSTEM = 1;
  // Assistant message.
  ROLE_ASSISTANT = 2;
  // User message.
  ROLE_USER = 3;
  // Tool message.
  ROLE_TOOL = 4;
}

// Controls the fidelity level for image processing in vision requests.
enum ImageQuality {
  // Unspecified quality. The provider will use its default setting.
  IMAGE_QUALITY_UNSPECIFIED = 0;
  // Automatic quality selection based on image size and content.
  IMAGE_QUALITY_AUTO = 1;
  // Low fidelity processing for faster, cheaper responses.
  IMAGE_QUALITY_LOW = 2;
  // High fidelity processing for detailed image analysis.
  IMAGE_QUALITY_HIGH = 3;
}
