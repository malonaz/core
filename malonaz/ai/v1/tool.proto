syntax = "proto3";

package malonaz.ai.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";
import "malonaz/json/v1/schema.proto";

option go_package = "github.com/malonaz/core/genproto/ai/v1";

// A Tool is a tool a model may be given. Platform tools (`tools/{tool}`) are mirrored from gRPC services by the ai
// processor and written by nothing else; an organization's tools (`organizations/{organization}/tools/{tool}`) are
// written by its clients. A model is given a tool under its id, the last segment of its name, so the tools offered
// together have distinct ids; a tool passed inline to a generation, never stored, carries its bare id as its name.
// A tool describes: what happens when it is called is its caller's business.
message Tool {
  option (google.api.resource) = {
    type: "ai.malonaz.com/Tool"
    pattern: "tools/{tool}"
    pattern: "organizations/{organization}/tools/{tool}"
    singular: "tool"
    plural: "tools"
  };
  option (malonaz.codegen.model.v1.model_opts) = {};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "5b0c7d2e-8a41-4f6b-9e3d-2c71a8f0b946";

  // The resource name of the tool, or an inline tool's bare id. Its id is the name the model calls it by.
  // Format: tools/{tool}
  // Format: organizations/{organization}/tools/{tool}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A description of what the tool does, as the model reads it.
  string description = 2 [(buf.validate.field).required = true];

  // The JSON schema of the tool's arguments: generated from a proto by whoever writes the tool, again at each of its
  // writes; written by hand only when no proto describes them.
  malonaz.json.v1.Schema json_schema = 3 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // Annotations about this tool (not transmitted to the ai provider), for tooling.
  // All annotations are inherited by any tool call created by this tool.
  map<string, string> annotations = 4 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // The creation timestamp of a stored tool.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of a stored tool.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A checksum computed by the server based on the current value of the resource.
  string etag = 7;

  // The labels on this tool: `ai.malonaz.com/tool-set` groups tools into sets.
  map<string, string> labels = 8 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
      }
      values: {
        string: {
          max_len: 63
          pattern: "^[a-z0-9_\\-\\p{L}]*$"
        }
      }
    }
  ];
}

// ToolMethod is the gRPC method a tool stands for, as its descriptors declare it: facts, never policy. It is the value
// of the `ai-engine.malonaz.com/method` annotation.
message ToolMethod {
  // Kind is the method's AIP kind.
  enum Kind {
    // Used to detect an unset field.
    KIND_UNSPECIFIED = 0;
    // A standard Get (AIP-131).
    KIND_GET = 1;
    // A batch Get (AIP-231).
    KIND_BATCH_GET = 2;
    // A standard List (AIP-132).
    KIND_LIST = 3;
    // A Search.
    KIND_SEARCH = 4;
    // A standard Create (AIP-133).
    KIND_CREATE = 5;
    // A batch Create (AIP-233).
    KIND_BATCH_CREATE = 6;
    // A standard Update (AIP-134).
    KIND_UPDATE = 7;
    // A standard Delete (AIP-135).
    KIND_DELETE = 8;
    // An Undelete (AIP-164).
    KIND_UNDELETE = 9;
    // An Import.
    KIND_IMPORT = 10;
    // An Export.
    KIND_EXPORT = 11;
    // Any other method (AIP-136).
    KIND_CUSTOM = 12;
  }

  // The service's full name.
  string service = 1;

  // The service's comment.
  string service_description = 2;

  // The method's full name.
  string method = 3;

  // The method's AIP kind: a standard method by its `standard_method` option, followed through a gateway's proxy;
  // else custom.
  Kind kind = 4 [(buf.validate.field).enum.defined_only = true];

  // The type of the resource the method acts on: a standard method's, else the type the request's `name` (or
  // `parent`) references. Empty for a method on no declared resource.
  string resource_type = 5;

  // The patterns of `resource_type`.
  repeated string resource_patterns = 6;

  // Whether the method declares `idempotency_level = NO_SIDE_EFFECTS`.
  bool read_only = 7;

  // Whether the method returns a google.longrunning.Operation.
  bool long_running = 8;

  // Whether the request has a `request_id`: a caller derives it from the call, so a retried call is not repeated.
  bool request_id = 9;

  // Whether the request pages (`page_size`, `page_token`).
  bool pagination = 10;

  // Whether the request takes a `filter`.
  bool filter = 11;

  // Whether the request takes an `update_mask`.
  bool update_mask = 12;
}

// A tool call that the model wants to invoke.
message ToolCall {
  // The id of this tool call.
  string id = 1 [(buf.validate.field).required = true];

  // The name of the tool to call.
  string name = 2 [(buf.validate.field).required = true];

  // The arguments to call the tool with.
  google.protobuf.Struct arguments = 3 [(buf.validate.field).required = true];

  // Provider specific extra fields.
  google.protobuf.Struct extra_fields = 4;

  // Annotations populated from the tool that created this tool call.
  map<string, string> annotations = 5;

  // If true, this is a partial tool call.
  bool partial = 6;

  // A server-generated result: a discovery call's, or the error answering a
  // call to an unknown tool. Clients feed it back instead of executing the call.
  ToolResult result = 7;
}

// The result of executing a tool call.
message ToolResult {
  // Name of the tool that created this result.
  string tool_name = 1;

  // ID of the tool call this message is responding to.
  string tool_call_id = 2;

  // Annotations.
  map<string, string> annotations = 6;

  // The outcome of the tool execution.
  oneof result {
    option (buf.validate.oneof).required = true;

    // The output returned by the tool execution.
    // May contain structured data (e.g., JSON) or plain text depending on the tool.
    string content = 3;

    // The output returned by the tool execution as structured data.
    google.protobuf.Value structured_content = 4;

    // Error if the tool execution failed.
    google.rpc.Status error = 5;
  }
}

// Controls which tool(s) the model should use.
message ToolChoice {
  option (buf.validate.message).cel = {
    id: "ai.v1.ToolChoice.mode_not_unspecified"
    message: "mode cannot be TOOL_CHOICE_MODE_UNSPECIFIED"
    expression: "!has(this.mode) || this.mode != 0"
  };

  // The choice.
  oneof choice {
    option (buf.validate.oneof).required = true;

    // Let the model decide whether to call a tool.
    ToolChoiceMode mode = 1 [(buf.validate.field).enum.defined_only = true];

    // Force the model to call a specific tool by name.
    string tool_name = 2;
  }
}

// Mode for tool choice.
enum ToolChoiceMode {
  // Used to detect an unset field.
  TOOL_CHOICE_MODE_UNSPECIFIED = 0;

  // Do not use any tool.
  TOOL_CHOICE_MODE_NONE = 1;

  // Let the model decide whether to call a tool.
  TOOL_CHOICE_MODE_AUTO = 2;

  // Require the model to call at least one tool.
  TOOL_CHOICE_MODE_REQUIRED = 3;
}

// =============================== TOOL SET ================================

// Represents a discoverable set of tools.
message ToolSet {
  // Name of this tool set.
  string name = 1;

  // The tool used to discover the tools in this set.
  Tool discovery_tool = 2 [(buf.validate.field).required = true];

  // The tools available in this set.
  repeated Tool tools = 3 [(buf.validate.field).required = true];
}

// A parsed tool call representing a request to discover tools from a tool set.
message ToolCallDiscovery {
  // Name of the tool set to discover tools from.
  string tool_set_name = 1;
  // The names of the tools to be discovered.
  repeated string tool_names = 2;
  // The discovered tools, including their full schemas. Populated server-side
  // so the schemas can be returned to the model as a tool result without
  // mutating the provider-visible tool list (which would break prompt caching).
  repeated Tool tools = 3;
  // Names the model asked for that do not exist in the tool set. Reported
  // alongside the successfully discovered tools rather than as an error, so a
  // partially-mistaken discovery call still yields the valid schemas.
  repeated string unknown_tool_names = 4;
}

// A parsed tool call representing a request to execute a previously
// discovered tool through the generic Execute tool.
message ToolCallExecute {
  // The name of the discovered tool to execute.
  string tool_name = 1 [(buf.validate.field).required = true];
  // The arguments to invoke the tool with.
  google.protobuf.Struct arguments = 2;
}

// A parsed tool call representing a request to execute a gRPC method.
message ToolCallRpc {
  // The full name of the service (e.g. "malonaz.ai.v1.AiEngine").
  string service_full_name = 1;
  // The full name of the method (e.g. "malonaz.ai.v1.AiEngine.CreateTool").
  string method_full_name = 2;
  // The request payload for the method.
  google.protobuf.Struct request = 3;
  // Optional field mask to filter which fields are included in the response.
  google.protobuf.FieldMask read_mask = 4;
}
