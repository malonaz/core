syntax = "proto3";

package malonaz.ai.v1;

import "google/api/resource.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/malonaz/core/genproto/ai/v1";

// Tracks metrics for an AI call.
message GenerationMetrics {
  // Time to first byte.
  // If empty, indicates that this was not streamed so it's equal to ttlb.
  google.protobuf.Duration ttfb = 1;
  // Time to last byte.
  google.protobuf.Duration ttlb = 2;
}

// Tracks model usage. When streamed out, incremental resource consumptions can be streamed out.
// The absolute truth for a resource consumption is the last one streamed out for this resource consumption.
//
// Every resource consumption below is disjoint: the categories partition the total rather than
// nesting, because each is priced separately (see Model.*_price_per_million). Providers that
// report nested counts must subtract before populating these fields — e.g. output_reasoning_token
// is excluded from output_token, and input_token_cache_read is excluded from input_token.
message ModelUsage {
  // The resource name of the model used.
  // Format: providers/{provider}/models/{model}
  string model = 1 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];
  // Input token usage.
  ResourceConsumption input_token = 2;
  // Output token usage.
  ResourceConsumption output_token = 3;
  // Output reasoning token usage.
  ResourceConsumption output_reasoning_token = 4;
  // Cache read token usage.
  ResourceConsumption input_token_cache_read = 5;
  // Cache write token usage.
  ResourceConsumption input_token_cache_write = 6;
  // Input seconds.
  ResourceConsumption input_second = 7;
  // Output seconds.
  ResourceConsumption output_second = 8;
  // Input characters.
  ResourceConsumption input_character = 9;
  // Input image token usage.
  ResourceConsumption input_image_token = 10;
  // Output image token usage.
  ResourceConsumption output_image_token = 11;
  // Cache read image token usage.
  ResourceConsumption input_image_token_cache_read = 12;
  // Cache write image token usage.
  ResourceConsumption input_image_token_cache_write = 13;
}

// Tracks a particular resource consumption.
message ResourceConsumption {
  // Number of units consumed.
  int32 quantity = 1;
  // Price in dollars for this resource consumption.
  double price = 2;
}
