syntax = "proto3";

package malonaz.ai.v1;

import "google/api/resource.proto";
import "google/type/interval.proto";

option go_package = "github.com/malonaz/core/genproto/ai/v1";

// Stats for a single time bucket.
message StatsBucket {
  // The interval covered by this bucket.
  google.type.Interval interval = 1;
  // The stats for this bucket.
  StatsSnapshot snapshot = 2;
}

// A full stats snapshot. Used for both interval totals and time-series buckets.
message StatsSnapshot {
  // Stats about chats.
  ChatStats chats = 1;
  // Stats about messages.
  MessageStats messages = 2;
}

// Stats about chats created within the interval.
message ChatStats {
  // Total chats created.
  int32 count = 1;
  // Total price in dollars of those chats, aggregated over their messages.
  double price = 2;
}

// Stats about messages created within the interval.
// Messages are broken down by the model that generated them; only assistant
// messages carry a model, so a breakdown's counts cover generated messages
// while `count` covers every message.
message MessageStats {
  // Total messages created, whatever their role.
  int32 count = 1;
  // Total price in dollars of those messages.
  double price = 2;
  // Breakdown by generating model, ordered by model resource name.
  repeated ModelBreakdown model_breakdowns = 3;
}

// Message counts and resource consumption for a single model.
// Consumption mirrors [ModelUsage][malonaz.ai.v1.ModelUsage] one-to-one: every
// category stays disjoint and separately reported, so clients can sum the ones
// they care about (and derive cache hit rates) without the server deciding for
// them.
message ModelBreakdown {
  // The model that generated the messages.
  // Empty groups messages that were not generated by a model (user, system
  // and tool messages).
  // Format: providers/{provider}/models/{model}
  string model = 1 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];
  // Messages generated by this model.
  int32 count = 2;
  // Price in dollars of those messages, summed over every category below.
  double price = 3;
  // Input tokens, excluding cached and image tokens.
  ResourceConsumptionStats input_token = 4;
  // Output tokens, excluding reasoning and image tokens.
  ResourceConsumptionStats output_token = 5;
  // Output reasoning tokens.
  ResourceConsumptionStats output_reasoning_token = 6;
  // Input tokens served from the provider's cache.
  ResourceConsumptionStats input_token_cache_read = 7;
  // Input tokens written to the provider's cache.
  ResourceConsumptionStats input_token_cache_write = 8;
  // Input seconds, for audio models.
  ResourceConsumptionStats input_second = 9;
  // Output seconds, for audio models.
  ResourceConsumptionStats output_second = 10;
  // Input characters, for models priced per character.
  ResourceConsumptionStats input_character = 11;
  // Input image tokens.
  ResourceConsumptionStats input_image_token = 12;
  // Output image tokens.
  ResourceConsumptionStats output_image_token = 13;
  // Input image tokens served from the provider's cache.
  ResourceConsumptionStats input_image_token_cache_read = 14;
  // Input image tokens written to the provider's cache.
  ResourceConsumptionStats input_image_token_cache_write = 15;
}

// Aggregated consumption of a single priced resource category.
// The aggregate counterpart of
// [ResourceConsumption][malonaz.ai.v1.ResourceConsumption].
message ResourceConsumptionStats {
  // Total units consumed.
  int64 quantity = 1;
  // Total price in dollars for those units.
  double price = 2;
}

// The bucket granularity for time-series stats.
enum StatsGranularity {
  // Used to detect an unset field. No time series is returned.
  STATS_GRANULARITY_UNSPECIFIED = 0;
  // One bucket per day.
  STATS_GRANULARITY_DAY = 1;
  // One bucket per week.
  STATS_GRANULARITY_WEEK = 2;
  // One bucket per month.
  STATS_GRANULARITY_MONTH = 3;
}
