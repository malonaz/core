syntax = "proto3";

package malonaz.ai.eval.v1;

import "malonaz/codegen/aip/v1/label.proto";

option go_package = "github.com/malonaz/core/genproto/ai/eval/v1";
option (malonaz.codegen.aip.v1.label) = {
  dynamic_key: "eval.malonaz.com/{eval}"
  description: "The verdict of the latest evaluation of an eval on this resource: its presence means the eval ran, its value is the verdict. Filter on it to find the resources an eval passed or failed; the evaluation itself is the annotation of the same key."
  values: [
    "pass",
    "fail",
    "not-applicable"
  ]
};
