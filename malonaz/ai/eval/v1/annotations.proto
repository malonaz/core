syntax = "proto3";

package malonaz.ai.eval.v1;

import "malonaz/codegen/aip/v1/annotation.proto";

option go_package = "github.com/malonaz/core/genproto/ai/eval/v1";
option (malonaz.codegen.aip.v1.annotation) = {
  dynamic_key: "eval.malonaz.com/{eval}"
  description: "The latest evaluation of an eval on this resource, rationale included. Its verdict is mirrored by the label of the same key."
  value_type: "Evaluation"
};
