syntax = "proto3";

package malonaz.ai.ai_engine.v1;

import "buf/validate/validate.proto";
import "google/api/client.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "malonaz/ai/v1/tool.proto";

option go_package = "github.com/malonaz/core/genproto/ai/ai_engine/v1";

// This API represents an AI Engine service for structured, proto-driven tool
// calling.
//
// # Capabilities
//
// - Tool creation: derive an [ai.v1.Tool][malonaz.ai.v1.Tool] — name,
//   description, and JSON schema — from a protobuf message or method
//   descriptor, so a model can emit arguments that map back onto typed
//   protos.
// - Tool call parsing: validate a model-emitted
//   [ToolCall][malonaz.ai.v1.ToolCall] against the schema of the tool that
//   created it, returning the parsed arguments as a typed result.
// - Tool discovery: bundle many tools behind a single discovery tool so
//   large tool surfaces don't bloat the model's context. The model first
//   calls the discovery tool to reveal the tools it needs, then calls them.
// - Service tool sets: turn an entire gRPC service into a discoverable
//   [ToolSet][malonaz.ai.v1.ToolSet], one tool per method, letting a model
//   drive the service through tool calls.
//
// # Typical flow
//
// 1. CreateTool / CreateServiceToolSet to build the tools offered to the
//    model alongside a generation request.
// 2. The model emits tool calls during generation.
// 3. ParseToolCall to turn each raw tool call into a typed result: a parsed
//    message, a discovery request, or an RPC request.
//
// Recoverable parse failures carry a
// [ParseToolCallRecoverableError][malonaz.ai.ai_engine.v1.ParseToolCallRecoverableError]
// error detail whose tool result can be appended to the conversation so the
// model can correct itself and retry.
service AiEngine {
  option (google.api.default_host) = "ai.malonaz.com";

  // Create a tool from a protobuf descriptor.
  //
  // The referenced message or method descriptor is converted into a tool
  // whose JSON schema mirrors the proto's fields, filtered and bounded by
  // the optional schema configuration. Tool calls produced against this
  // tool can be parsed back into the proto via ParseToolCall.
  rpc CreateTool(CreateToolRequest) returns (ai.v1.Tool) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Create multiple tools in a single call.
  //
  // Equivalent to calling CreateTool for each request; tools are returned in
  // the same order as the requests.
  rpc BatchCreateTools(BatchCreateToolsRequest) returns (BatchCreateToolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Parse a tool call emitted against a tool created by this service.
  //
  // Validates the call's arguments against the originating tool's schema
  // and returns exactly one of:
  // - a parsed message (generic tools created by CreateTool),
  // - a discovery request (calls to a discovery tool),
  // - an RPC request (calls to a method tool from a service tool set).
  //
  // When the failure is correctable by the model, the error carries a
  // [ParseToolCallRecoverableError][malonaz.ai.ai_engine.v1.ParseToolCallRecoverableError]
  // detail ready to be fed back into the conversation.
  rpc ParseToolCall(ParseToolCallRequest) returns (ParseToolCallResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Create a discovery tool for a set of tools.
  //
  // The returned tool exposes only the names and descriptions of the
  // underlying tools; the model calls it to request the full schema of the
  // tools it actually needs, keeping unused schemas out of its context.
  rpc CreateDiscoveryTool(CreateDiscoveryToolRequest) returns (ai.v1.Tool) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Create a discoverable tool set for a gRPC service.
  //
  // The tool set includes a discovery tool that lists available method tools,
  // and individual tools for each method in the service.
  // Methods listed in `discovered_method_names` are exposed immediately,
  // without requiring a discovery round trip.
  rpc CreateServiceToolSet(CreateServiceToolSetRequest) returns (ai.v1.ToolSet) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Request message for AiEngine.CreateTool
message CreateToolRequest {
  option (buf.validate.message).cel = {
    id: "schema_config_requires_method"
    message: "with_response_read_mask and with_response_schema_max_depth require method descriptor"
    expression: "(!has(this.schema_configuration) || (!this.schema_configuration.with_response_read_mask && this.schema_configuration.with_response_schema_max_depth == 0)) || (has(this.descriptor_reference) && has(this.descriptor_reference.method))"
  };

  // The descriptor reference for which to create a tool.
  DescriptorReference descriptor_reference = 1 [(buf.validate.field).required = true];

  // Configuration for the schema.
  SchemaConfiguration schema_configuration = 2;
}

// Request message for AiEngine.BatchCreateTools.
message BatchCreateToolsRequest {
  // The tool creation requests.
  repeated CreateToolRequest requests = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Response message for AiEngine.BatchCreateTools.
message BatchCreateToolsResponse {
  // The created tools, in the same order as the requests.
  repeated ai.v1.Tool tools = 1;
}

// Request message for AiEngine.ParseToolCall.
message ParseToolCallRequest {
  // The tool call to parse.
  ai.v1.ToolCall tool_call = 1 [(buf.validate.field).required = true];

  // Must be passed if tool call *can* be of type `DiscoverToolsRequest` or `RpcRequest`
  // in order to ensure the call is valid.
  // if `DiscoverToolsRequest`:
  //  - targets a non existent tool set => NotFound
  // Already discovered tools are simply omitted from the discovery result.
  // if `RpcRequest`:
  //  - targets a non-discovered method => FailedPrecondition.
  repeated ai.v1.ToolSet tool_sets = 2;
}

// Response message for AiEngine.ParseToolCall.
message ParseToolCallResponse {
  // The parsed result based on the tool call type.
  oneof result {
    // A generic parsed message.
    google.protobuf.Struct message = 1;
    // A request to discover additional tools from a tool set.
    ai.v1.ToolCallDiscovery discovery = 2;
    // A request to execute a gRPC method.
    ai.v1.ToolCallRpc rpc = 3;
  }

  // Short human-readable summary of what this tool call does,
  // if the tool was created with `SchemaConfiguration.with_title`.
  string title = 4;
}

// Request message for AiEngine.CreateDiscoveryTool.
message CreateDiscoveryToolRequest {
  // The name of this discovery tool.
  string name = 1 [(buf.validate.field).required = true];

  // Description of what this tool set represents.
  string description = 2 [(buf.validate.field).required = true];

  // The tools that can be discovered.
  repeated ai.v1.Tool tools = 3 [(buf.validate.field).required = true];
}

// Request message for AiEngine.CreateServiceToolSet.
message CreateServiceToolSetRequest {
  // The fully qualified name of the gRPC service.
  // Example: "malonaz.ai.ai_engine.v1.AiEngine"
  string service_full_name = 1 [(buf.validate.field).required = true];

  // Optional list of method names to include.
  // If empty, all methods from the service are included.
  // Example: ["CreateTool"]
  repeated string method_names = 2;

  // Configuration for the schema (applies to all tools created).
  SchemaConfiguration schema_configuration = 3;

  // Set a specific schema configuration for a method.
  map<string, SchemaConfiguration> method_name_to_schema_configuration = 4;

  // Any method listed here will be auto-discovered.
  repeated string discovered_method_names = 5;
}

// Error detail indicating the error can be fed back to the AI for correction.
// Callers can extract the tool result and append it to the conversation history for the model to retry.
message ParseToolCallRecoverableError {
  // The tool result representing the failure, ready to be sent back to the model.
  malonaz.ai.v1.ToolResult tool_result = 1 [(buf.validate.field).required = true];
}

// Configuration for a tool set schema.
message SchemaConfiguration {
  // Control which field are included in the tool schema.
  google.protobuf.FieldMask field_mask = 1;

  // Set a max depth for the schema (defaults to 5).
  int32 with_max_depth = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 10
  }];

  // (ONLY WORKS FOR RPCS). If set, we inject a `response_field_mask` field in the tool schema, which allows the LLM to
  // return a field mask to apply to the tool call result. This is useful in letting the LLM only fetch the data it needs
  // rather than being returned tool results with fields it does not need.
  bool with_response_read_mask = 3;

  // (ONLY WORKS FOR RPCS). If set, we include the schema of the response in the tool description.
  // This can be quite verbose so use with care.
  int32 with_response_schema_max_depth = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 10
  }];

  // If set, we inject a required `tool_call_title` field in the tool schema, documented with
  // this string. The AI is instructed to generate this field first. Useful when surfacing tool
  // calls to users for review/approval (e.g. "A short summary of the update, shown to the user").
  string with_title = 5;

  // If set, we inject a required `tool_call_summary` field in the tool schema, documented with
  // this string. Unlike `with_title` (a short headline), this is a human-readable account of what
  // the call will do — intended for approval surfaces that must never show raw arguments or
  // resource names (e.g. "Send John Smith (860-597-9800) the $4,200 deck quote").
  string with_summary = 6;
}

// A reference to a protobuf descriptor.
message DescriptorReference {
  // The descriptor full name.
  oneof full_name {
    option (buf.validate.oneof).required = true;
    // The fully qualified name of the message.
    string message = 1;
    // The fully qualified name of the method.
    string method = 2;
  }
}
