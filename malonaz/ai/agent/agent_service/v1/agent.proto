syntax = "proto3";

package malonaz.ai.agent.agent_service.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "malonaz/ai/agent/v1/agent.proto";
import "malonaz/ai/agent/v1/event.proto";
import "malonaz/ai/agent/v1/input.proto";
import "malonaz/codegen/aip/v1/aip.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/agent_service/v1";

// Request message for AgentService.CreateAgent.
message CreateAgentRequest {
  // The user owning the agent.
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/User"
  ];

  // The agent to create: from a definition, or ad-hoc with an inline spec.
  malonaz.ai.agent.v1.Agent agent = 2 [(buf.validate.field).required = true];

  // The ID to use for the agent, which becomes the final component of its name.
  string agent_id = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-z0-9](-?[a-z0-9])*$"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // A unique identifier for this request. Must be a UUID.
  string request_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Request message for AgentService.GetAgent.
message GetAgentRequest {
  // The agent to retrieve.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];
}

// Request message for AgentService.UpdateAgent.
message UpdateAgentRequest {
  option (malonaz.codegen.aip.v1.update) = {
    paths: [
      "labels",
      "annotations",
      "title",
      "executor"
    ]
  };
  option (buf.validate.message).cel = {
    id: "agent.name_required"
    message: "agent.name must be set"
    expression: "has(this.agent.name)"
  };

  // The agent to update.
  malonaz.ai.agent.v1.Agent agent = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

// Request message for AgentService.DeleteAgent.
message DeleteAgentRequest {
  // The agent to delete.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // If true, and the agent is not found, the request succeeds without action.
  bool allow_missing = 2;

  // If set, the request only succeeds if the current etag matches this value.
  string etag = 3;

  // If true, the agent's sub-agents are deleted too. Otherwise the request
  // fails if it has any.
  bool force = 4;
}

// Request message for AgentService.UndeleteAgent.
message UndeleteAgentRequest {
  // The deleted agent to restore.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // If set, the request only succeeds if the current etag matches this value.
  string etag = 2;
}

// Request message for AgentService.ListAgents.
message ListAgentsRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: [
      "create_time",
      "update_time"
    ]
    default: "create_time desc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The user owning the agents. Use "organizations/{organization}/users/-" to
  // list across users.
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/User"
  ];

  // @autogen.
  string filter = 2;

  // If true, include soft-deleted agents.
  bool show_deleted = 3;

  // @autogen
  string order_by = 4;

  // Maximum number of agents to return (max 100).
  int32 page_size = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // A page token, received from a previous `ListAgents` call.
  string page_token = 6;
}

// Response message for AgentService.ListAgents.
message ListAgentsResponse {
  // The agents.
  repeated malonaz.ai.agent.v1.Agent agents = 1;

  // A token to retrieve the next page. Omitted when there are no more pages.
  string next_page_token = 2;
}

// Request message for AgentService.CancelAgent.
message CancelAgentRequest {
  // The agent whose running turn to cancel. Pending inputs stay queued.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];
}

// The amount of an agent's activity a StreamAgent call streams.
enum AgentView {
  // Used to detect an unset field. Behaves as BASIC.
  AGENT_VIEW_UNSPECIFIED = 0;
  // The agent's events: its log replayed from `after_sequence`, then live.
  AGENT_VIEW_BASIC = 1;
  // BASIC plus the live deltas of in-flight generations, token by token.
  AGENT_VIEW_FULL = 2;
}

// Request message for AgentService.StreamAgent.
message StreamAgentRequest {
  // The agent to stream.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // How much activity to stream.
  AgentView view = 2 [(buf.validate.field).enum.defined_only = true];

  // Replay events after this sequence before going live. 0 replays the whole
  // log; the agent's `last_event_sequence` streams live activity only.
  int64 after_sequence = 3 [(buf.validate.field).int64.gte = 0];

  // If true, also stream every descendant agent, present and future: a whole
  // tree in one stream. Replay then starts at each agent's beginning.
  bool include_descendants = 4;
}

// Response message for AgentService.StreamAgent.
message StreamAgentResponse {
  // What is streamed.
  oneof content {
    option (buf.validate.oneof).required = true;

    // A persisted event of the agent or one of its descendants.
    malonaz.ai.agent.v1.Event event = 1;

    // A live generation delta. FULL view only.
    malonaz.ai.agent.v1.Delta delta = 2;

    // Sent once replay is done and the stream is live.
    CaughtUp caught_up = 3;
  }

  // CaughtUp marks the end of replay.
  message CaughtUp {}
}

// Request message for AgentService.ListEvents.
message ListEventsRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: ["sequence"]
    default: "sequence asc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The agent whose events to list.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // @autogen.
  string filter = 2;

  // @autogen
  string order_by = 3;

  // Maximum number of events to return (max 1000).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // A page token, received from a previous `ListEvents` call.
  string page_token = 5;
}

// Response message for AgentService.ListEvents.
message ListEventsResponse {
  // The events.
  repeated malonaz.ai.agent.v1.Event events = 1;

  // A token to retrieve the next page. Omitted when there are no more pages.
  string next_page_token = 2;
}

// Request message for AgentService.CreateInput.
message CreateInputRequest {
  // The agent to send the input to.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // The input to queue.
  malonaz.ai.agent.v1.Input input = 2 [(buf.validate.field).required = true];

  // A unique identifier for this request. Must be a UUID.
  string request_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Request message for AgentService.ListInputs.
message ListInputsRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: ["create_time"]
    default: "create_time asc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The agent whose inputs to list.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // @autogen. `NOT consume_time:*` lists the pending inputs.
  string filter = 2;

  // @autogen
  string order_by = 3;

  // Maximum number of inputs to return (max 100).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // A page token, received from a previous `ListInputs` call.
  string page_token = 5;
}

// Response message for AgentService.ListInputs.
message ListInputsResponse {
  // The inputs.
  repeated malonaz.ai.agent.v1.Input inputs = 1;

  // A token to retrieve the next page. Omitted when there are no more pages.
  string next_page_token = 2;
}
