syntax = "proto3";

package malonaz.ai.agent.agent_service.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/ai/agent/v1/definition.proto";
import "malonaz/ai/v1/message.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/agent_service/v1";

// The arguments of the built-in create_agents tool.
message CreateAgentsToolArguments {
  // A sub-agent to launch.
  message SubAgent {
    // A short human-readable title for the sub-agent.
    string title = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).string.max_len = 512
    ];

    // The sub-agent's task, its first message. It shares none of your context: include everything it needs, and
    // what to report back.
    string task = 2 [(buf.validate.field).required = true];

    // The definition to run, one of those you may launch. Omit for an ad-hoc sub-agent.
    // Format: organizations/{organization}/definitions/{definition}
    string definition = 3;

    // An ad-hoc sub-agent's system prompt. Required without a definition.
    string instructions = 4;

    // An ad-hoc sub-agent's model. Defaults to yours.
    // Format: providers/{provider}/models/{model}
    string model = 5;

    // An ad-hoc sub-agent's reasoning effort. Defaults to yours.
    malonaz.ai.v1.ReasoningEffort reasoning_effort = 6;

    // An ad-hoc sub-agent's tools, a subset of yours. Defaults to all of yours. A tool's approval defaults to yours
    // and may only tighten it. The built-in agent tools are always given.
    repeated malonaz.ai.agent.v1.AgentSpec.Tool tools = 7;
  }

  // The sub-agents to launch.
  repeated SubAgent agents = 1 [(buf.validate.field).repeated.min_items = 1];
}

// The arguments of the built-in message_agent tool.
message MessageAgentToolArguments {
  // The recipient, an agent of your tree.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string agent = 1 [(buf.validate.field).required = true];

  // The message to send.
  string message = 2 [(buf.validate.field).required = true];
}

// The arguments of the built-in list_agents tool.
message ListAgentsToolArguments {}

// The arguments of the built-in update_labels tool.
message UpdateLabelsToolArguments {
  // Labels to set, by key. Values are lowercase letters, digits, '_' and '-', at most 63 characters.
  map<string, string> set = 1;

  // Keys of labels to remove.
  repeated string remove = 2;
}

// The arguments of the built-in schedule tool.
message ScheduleToolArguments {
  option (buf.validate.message).cel = {
    id: "schedule.cron_time_zone"
    message: "a cron needs its time_zone"
    expression: "!has(this.cron) || this.time_zone != ''"
  };

  // When you are woken: every tick of a cron, or once.
  oneof when {
    option (buf.validate.oneof).required = true;

    // Recurring: a five-field cron expression (minute hour day-of-month month day-of-week), e.g. `0 9 * * MON-FRI`
    // for 9am on weekdays.
    string cron = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }];

    // Once, at this time: RFC 3339 with an offset, e.g. `2026-11-07T09:00:00+01:00`.
    google.protobuf.Timestamp time = 2;

    // Once, this long from now, e.g. `7200s` for two hours.
    google.protobuf.Duration delay = 3 [(buf.validate.field).duration.gt = {}];
  }

  // The IANA time zone the cron is evaluated in, e.g. `Europe/Paris`: the user's, so their 9am is 9am for them.
  // Required with a cron.
  string time_zone = 4 [(buf.validate.field).string.max_len = 64];

  // What each run does.
  oneof wake {
    option (buf.validate.oneof).required = true;

    // Wake yourself with this message, continuing this conversation with everything you know.
    string message = 5 [(buf.validate.field).string.min_len = 1];

    // Launch this sub-agent, its task its first message: it starts from a fresh context, and its report wakes you.
    CreateAgentsToolArguments.SubAgent sub_agent = 6;
  }
}

// The arguments of the built-in list_schedules tool.
message ListSchedulesToolArguments {}

// The arguments of the built-in cancel_schedule tool.
message CancelScheduleToolArguments {
  // The schedule to cancel, as list_schedules names it: a recurring schedule or a one-off run.
  // Format: organizations/{organization}/users/{user}/schedules/{schedule}
  // Format: organizations/{organization}/users/{user}/jobs/{job}
  string name = 1 [(buf.validate.field).required = true];
}
