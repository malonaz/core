syntax = "proto3";

package malonaz.ai.agent.agent_service.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "malonaz/ai/agent/v1/agent.proto";
import "malonaz/ai/agent/v1/event.proto";
import "malonaz/ai/agent/v1/executor.proto";
import "malonaz/ai/agent/v1/input.proto";
import "malonaz/codegen/aip/v1/aip.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/agent_service/v1";

// Request message for AgentService.GetExecutor.
message GetExecutorRequest {
  // The executor to retrieve.
  // Format: organizations/{organization}/executors/{executor}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Executor"
  ];
}

// Request message for AgentService.ListExecutors.
message ListExecutorsRequest {
  option (malonaz.codegen.aip.v1.pagination) = {default_page_size: 100};
  option (malonaz.codegen.aip.v1.ordering) = {
    paths: [
      "create_time",
      "heartbeat_time"
    ]
    default: "create_time desc"
  };
  option (malonaz.codegen.aip.v1.filtering) = {
    paths: ["*"]
  };

  // The organization owning the executors.
  // Format: organizations/{organization}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Organization"
  ];

  // @autogen.
  string filter = 2;

  // @autogen
  string order_by = 3;

  // Maximum number of executors to return (max 100).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // A page token, received from a previous `ListExecutors` call.
  string page_token = 5;
}

// Response message for AgentService.ListExecutors.
message ListExecutorsResponse {
  // The executors.
  repeated malonaz.ai.agent.v1.Executor executors = 1;

  // A token to retrieve the next page. Omitted when there are no more pages.
  string next_page_token = 2;
}

// Request message for AgentService.ConnectExecutor: what an executor reports.
// The first message must be `register`.
message ConnectExecutorRequest {
  // What the executor reports.
  oneof content {
    option (buf.validate.oneof).required = true;

    // Registers the executor, creating or updating it. First message only.
    Register register = 1;

    // Proves the executor alive. Missing heartbeats past the deadline release its agents.
    Heartbeat heartbeat = 2;

    // An event of a leased agent: a turn started, a message persisted, a turn ended.
    Report report = 3;

    // A live generation delta of a leased agent, fanned out to FULL streams.
    malonaz.ai.agent.v1.Delta delta = 4;

    // Gives up a leased agent, returning it to pending.
    Release release = 5;
  }

  // Register names and describes the executor.
  message Register {
    // The organization the executor serves.
    // Format: organizations/{organization}
    string parent = 1 [
      (buf.validate.field).required = true,
      (google.api.resource_reference).type = "agent.ai.malonaz.com/Organization"
    ];

    // The executor's ID: stable across reconnects, so it resumes its identity.
    string executor_id = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-z0-9](-?[a-z0-9])*$"
    }];

    // The executor's labels, display name, capacity and tools.
    malonaz.ai.agent.v1.Executor executor = 3 [(buf.validate.field).required = true];
  }

  // Heartbeat proves the executor alive.
  message Heartbeat {}

  // Report carries an event of a leased agent.
  message Report {
    // The agent the event belongs to.
    // Format: organizations/{organization}/users/{user}/agents/{agent}
    string agent = 1 [
      (buf.validate.field).required = true,
      (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
    ];

    // The event. Executors report turn_started, message_created and
    // turn_ended; the service records every other kind itself.
    malonaz.ai.agent.v1.Event event = 2 [(buf.validate.field).required = true];
  }

  // Release gives up a leased agent.
  message Release {
    // The agent to release.
    // Format: organizations/{organization}/users/{user}/agents/{agent}
    string agent = 1 [
      (buf.validate.field).required = true,
      (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
    ];
  }
}

// Response message for AgentService.ConnectExecutor: what the service tells
// an executor.
message ConnectExecutorResponse {
  // What the service tells the executor.
  oneof content {
    option (buf.validate.oneof).required = true;

    // The registered executor. First message only.
    malonaz.ai.agent.v1.Executor registered = 1;

    // An agent the executor now holds. Its pending inputs follow.
    malonaz.ai.agent.v1.Agent lease = 2;

    // An input queued for a held agent: drain it into the agent's next turn.
    malonaz.ai.agent.v1.Input input = 3;

    // Cancels the running turn of a held agent.
    Cancel cancel = 4;

    // Takes a held agent away, e.g. once deleted: stop running it.
    Revoke revoke = 5;
  }

  // Cancel names the agent whose turn to cancel.
  message Cancel {
    // The agent.
    // Format: organizations/{organization}/users/{user}/agents/{agent}
    string agent = 1 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"];
  }

  // Revoke names the agent taken away.
  message Revoke {
    // The agent.
    // Format: organizations/{organization}/users/{user}/agents/{agent}
    string agent = 1 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"];
  }
}
