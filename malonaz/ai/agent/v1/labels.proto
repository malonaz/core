syntax = "proto3";

package malonaz.ai.agent.v1;

import "malonaz/codegen/aip/v1/label.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (malonaz.codegen.aip.v1.label) = {
  key: "agent.ai.malonaz.com/agent"
  description: "The id of an agent, the last segment of its resource name; the resource's parent, the agent's user, holds the rest. Set by the AgentService, never by clients. On an AiService chat: the agent owning it, which marks the chat as an agent's transcript, which the AgentService writes. On a scheduler Schedule or Job: the agent it wakes, which created it through its schedule tool; a Schedule's tick jobs inherit it. List an agent's recurring schedules with ListSchedules and its pending one-offs with ListJobs, under its user, filtered on `labels.\"agent.ai.malonaz.com/agent\" = \"{agent}\"`, adding `NOT schedule:*` for the jobs."
};
option (malonaz.codegen.aip.v1.label) = {
  key: "agent.ai.malonaz.com/wake"
  values: [
    "self",
    "sub-agent"
  ]
  description: "On a scheduler Schedule or Job waking an agent: how each run wakes it. `self` queues the run's message on the agent; `sub-agent` launches a sub-agent of it with the run's task, whose report wakes it. Set by the AgentService beside agent.ai.malonaz.com/agent."
};
