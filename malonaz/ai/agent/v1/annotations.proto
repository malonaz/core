syntax = "proto3";

package malonaz.ai.agent.v1;

import "malonaz/codegen/aip/v1/annotation.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/sender"
  description: "On an input's message: the resource name of who sent it, a user or an agent. Clients stamp their own; the service stamps the inputs agents send through their built-in tools, and each sub-agent's turn report with the sub-agent's name."
};
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/inputs"
  description: "On a user message of an agent's chat: the comma-separated resource names of the inputs it delivers, oldest first. A turn drains every pending input into one such message, its blocks the inputs' blocks in order; read each input for its sender."
};
