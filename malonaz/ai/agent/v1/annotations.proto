syntax = "proto3";

package malonaz.ai.agent.v1;

import "malonaz/codegen/aip/v1/annotation.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/sender"
  description: "On an input's message: the resource name of who sent it, a user or an agent. Callers stamp it, as the service cannot tell which agent an executor calls for; the service stamps a sub-agent's turn report with the sub-agent's name."
};
