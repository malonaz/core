syntax = "proto3";

package malonaz.ai.agent.v1;

import "malonaz/codegen/aip/v1/annotation.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/sender"
  description: "On a message sent to an agent: the resource name of who sent it, a user or an agent. Clients stamp their own; the service stamps the messages agents send through their built-in tools, and each sub-agent's turn report with the sub-agent's name."
};
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/messages"
  description: "On a user message of an agent's chat delivering the messages sent to it: the comma-separated resource names of the delivered messages, oldest first. Its blocks are theirs in order, each agent-sent one preceded by a header naming its sender; read each delivered message for its exact content and sender."
};
