syntax = "proto3";

package malonaz.ai.agent.v1;

import "malonaz/codegen/aip/v1/annotation.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/sender"
  description: "On a message sent to an agent: the resource name of who sent it, stamped by the AgentService: the user owning the agent for a client's message, the sending agent for the messages agents send through their built-in tools and for each sub-agent's turn report."
};
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/approved-by"
  description: "On the result of a tool call that awaited approval: the resource name of who approved it."
};
option (malonaz.codegen.aip.v1.annotation) = {
  key: "agent.ai.malonaz.com/denied-by"
  description: "On the error result of a tool call that awaited approval: the resource name of who denied it, by an error result, a reply or a cancellation."
};
