syntax = "proto3";

package malonaz.ai.agent.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "malonaz/ai/agent/v1/definition.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";
option (google.api.resource_definition) = {
  type: "agent.ai.malonaz.com/User"
  pattern: "organizations/{organization}/users/{user}"
  singular: "user"
  plural: "users"
};

// An Agent is a running instance of a spec: a conversation the AgentService
// drives one turn at a time, fed by the inputs it is sent. The transcript
// lives in its [Chat][malonaz.ai.v1.Chat] on the AiService, which is the
// agent's durable history. Agents talk to each other asynchronously, through
// inputs only: a parent sends its sub-agents inputs, and each turn a sub-agent
// ends is queued as an input on its parent, waking it.
message Agent {
  option (google.api.resource) = {
    type: "agent.ai.malonaz.com/Agent"
    pattern: "organizations/{organization}/users/{user}/agents/{agent}"
    singular: "agent"
    plural: "agents"
  };
  option (buf.validate.message).cel = {
    id: "agent.spec_or_definition"
    message: "definition or spec must be set"
    expression: "this.definition != '' || has(this.spec)"
  };
  option (malonaz.codegen.model.v1.model_opts) = {};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "a8d40bb6-3f99-4d02-95ff-71b5be47b1e7";

  // State is where the agent is in its lifecycle.
  enum State {
    // Used to detect an unset field.
    STATE_UNSPECIFIED = 0;
    // The agent waits for input.
    STATE_IDLE = 1;
    // One of the agent's turns is running.
    STATE_RUNNING = 2;
  }

  // TurnOutcome is how a turn ended.
  enum TurnOutcome {
    // Used to detect an unset field.
    TURN_OUTCOME_UNSPECIFIED = 0;
    // The turn ended on a final answer.
    TURN_OUTCOME_SUCCEEDED = 1;
    // The turn ended on an error, held in `status`.
    TURN_OUTCOME_FAILED = 2;
    // The turn was cancelled.
    TURN_OUTCOME_CANCELLED = 3;
  }

  // The resource name of the agent.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the agent.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the agent.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The deletion timestamp of the agent. Set when soft-deleted, which cancels its running turn.
  google.protobuf.Timestamp delete_time = 4 [
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // A checksum computed by the server based on the current value of the resource.
  string etag = 5;

  // The labels on this agent. Agents label themselves through their built-in update_labels tool.
  map<string, string> labels = 6 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
      }
      values: {
        string: {
          max_len: 63
          pattern: "^[a-z0-9_\\-\\p{L}]*$"
        }
      }
    }
  ];

  // Annotations on this agent, for tooling. Values are opaque.
  map<string, string> annotations = 7 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // A human-readable title for this agent.
  string title = 8 [(buf.validate.field).string.max_len = 512];

  // The definition this agent was created from. Empty for an ad-hoc agent.
  // Format: organizations/{organization}/definitions/{definition}
  string definition = 9 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Definition"
  ];

  // The spec this agent runs: its definition's, snapshotted at creation, or
  // the inline spec of an ad-hoc agent.
  AgentSpec spec = 10 [
    (google.api.field_behavior) = IMMUTABLE,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // The agent that launched this one. Empty for a root agent.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string parent_agent = 11 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // The root of this agent's tree: itself for a root agent. Filter on it to
  // list a whole tree.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string root_agent = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // The chat holding the agent's transcript, created with the agent.
  // Format: organizations/{organization}/users/{user}/chats/{chat}
  string chat = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ai.malonaz.com/Chat"
  ];

  // Where the agent is in its lifecycle.
  State state = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // How the agent's latest turn ended. Unset until a turn ends.
  TurnOutcome last_turn_outcome = 15 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // The error the latest turn failed on. Set only when it failed.
  google.rpc.Status status = 16 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];
}
