syntax = "proto3";

package malonaz.ai.agent.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/codegen/aip/v1/aip.proto";
import "malonaz/codegen/model/v1/model.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";

// An Executor is a process that runs agents' turns: it holds the tools, the
// compute and the credentials, so the AgentService needs none. Executors are
// never called: they dial in through ConnectExecutor, which registers them,
// carries their heartbeats and leases them agents, up to `max_agents` at once.
message Executor {
  option (google.api.resource) = {
    type: "agent.ai.malonaz.com/Executor"
    pattern: "organizations/{organization}/executors/{executor}"
    singular: "executor"
    plural: "executors"
  };
  option (malonaz.codegen.model.v1.model_opts) = {};
  option (malonaz.codegen.aip.v1.uuid_namespace) = "ff5f13c0-4122-4b2d-b40a-6757bc495044";

  // State is whether the executor can run agents.
  enum State {
    // Used to detect an unset field.
    STATE_UNSPECIFIED = 0;
    // Connected and heartbeating: it may be leased agents.
    STATE_ONLINE = 1;
    // Disconnected or silent past its heartbeat deadline: its agents were released.
    STATE_OFFLINE = 2;
  }

  // The resource name of the executor.
  // Format: organizations/{organization}/executors/{executor}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the executor: its first registration.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update timestamp of the executor.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The labels on this executor, matched against agents' executor selectors.
  map<string, string> labels = 6 [
    (malonaz.codegen.model.v1.field_opts).as_json_bytes = true,
    (malonaz.codegen.model.v1.field_opts).nullable = true,
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?/)?[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?$"}
      }
      values: {
        string: {
          max_len: 63
          pattern: "^[a-z0-9_\\-\\p{L}]*$"
        }
      }
    }
  ];

  // A human-readable name for this executor.
  string display_name = 7 [(buf.validate.field).string.max_len = 128];

  // The most agents the executor runs at once.
  int32 max_agents = 8 [(buf.validate.field).int32.gt = 0];

  // The tools the executor provides to the agents it runs.
  repeated string tools = 9 [(buf.validate.field).repeated = {
    max_items: 256
    unique: true
  }];

  // Whether the executor can run agents.
  State state = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // When the executor last connected.
  google.protobuf.Timestamp connect_time = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // When the executor last heartbeated.
  google.protobuf.Timestamp heartbeat_time = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (malonaz.codegen.model.v1.field_opts).nullable = true
  ];

  // The number of agents the executor currently holds.
  int32 agent_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}
