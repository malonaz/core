syntax = "proto3";

package malonaz.ai.agent.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "malonaz/ai/agent/v1/agent.proto";
import "malonaz/ai/v1/message.proto";
import "malonaz/codegen/aip/v1/aip.proto";

option go_package = "github.com/malonaz/core/genproto/ai/agent/v1";

// An Event is one entry in an agent's append-only log: everything a client
// needs to render the agent, replayable from any sequence. Executors report
// events; the service also records the ones it causes (leases, inputs).
message Event {
  option (google.api.resource) = {
    type: "agent.ai.malonaz.com/Event"
    pattern: "organizations/{organization}/users/{user}/agents/{agent}/events/{event}"
    singular: "event"
    plural: "events"
  };
  option (malonaz.codegen.aip.v1.uuid_namespace) = "3c88dbad-fedf-47de-a2b8-e19c2fd7365c";

  // The resource name of the event, its ID being its sequence.
  // Format: organizations/{organization}/users/{user}/agents/{agent}/events/{event}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The creation timestamp of the event.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The event's position in its agent's log: dense, starting at 1.
  int64 sequence = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What happened.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // The agent changed state.
    StateChanged state_changed = 4;

    // An executor leased or released the agent.
    LeaseChanged lease_changed = 5;

    // An input was queued in the agent's inbox.
    InputQueued input_queued = 6;

    // A turn started.
    TurnStarted turn_started = 7;

    // A message was persisted to the agent's chat: the assistant's generations
    // (text, thoughts, tool calls) and the tool results answering them.
    MessageCreated message_created = 8;

    // A turn ended.
    TurnEnded turn_ended = 9;

    // The agent launched a sub-agent.
    SubAgentCreated sub_agent_created = 10;

    // The agent's labels changed.
    LabelsChanged labels_changed = 11;
  }

  // StateChanged records a state transition.
  message StateChanged {
    // The state entered.
    Agent.State state = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
  }

  // LeaseChanged records a lease taken or lost.
  message LeaseChanged {
    // The executor now holding the lease. Empty when released.
    // Format: organizations/{organization}/executors/{executor}
    string executor = 1 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Executor"];
  }

  // InputQueued records an input sent to the agent.
  message InputQueued {
    // The queued input.
    // Format: organizations/{organization}/users/{user}/agents/{agent}/inputs/{input}
    string input = 1 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Input"];

    // The input's message.
    malonaz.ai.v1.Message message = 2 [(buf.validate.field).required = true];
  }

  // TurnStarted records the start of a turn.
  message TurnStarted {}

  // MessageCreated carries a message persisted to the agent's chat.
  message MessageCreated {
    // The persisted message, with its resource name.
    malonaz.ai.v1.Message message = 1 [(buf.validate.field).required = true];

    // The inputs this message delivered, when the executor drained them into
    // it, at a turn's start or between its tool rounds. The service marks
    // them consumed.
    // Format: organizations/{organization}/users/{user}/agents/{agent}/inputs/{input}
    repeated string inputs = 2 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Input"];
  }

  // TurnEnded records the end of a turn.
  message TurnEnded {
    // How the turn ended.
    Agent.TurnOutcome outcome = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];

    // The error the turn failed on. Set only when it failed.
    google.rpc.Status status = 2;
  }

  // SubAgentCreated records a sub-agent launch.
  message SubAgentCreated {
    // The launched sub-agent.
    // Format: organizations/{organization}/users/{user}/agents/{agent}
    string agent = 1 [(google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"];
  }

  // LabelsChanged records the agent's labels after a change.
  message LabelsChanged {
    // The agent's labels after the change.
    map<string, string> labels = 1;
  }
}

// A Delta is an ephemeral piece of an in-flight generation: a streamed block
// of the message the agent is generating. Deltas are never stored; the
// message they build is, as a MessageCreated event.
message Delta {
  // The agent generating.
  // Format: organizations/{organization}/users/{user}/agents/{agent}
  string agent = 1 [
    (buf.validate.field).required = true,
    (google.api.resource_reference).type = "agent.ai.malonaz.com/Agent"
  ];

  // The streamed block delta, as StreamGenerateMessage yields it.
  malonaz.ai.v1.Block block = 2 [(buf.validate.field).required = true];
}
