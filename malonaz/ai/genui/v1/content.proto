syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// Label/value facts, e.g. a lead summary ("Budget: $10-15k").
message KeyValueList {
  // Optional heading rendered above the items.
  string title = 1;

  // The facts to render, in display order.
  repeated KeyValueListItem items = 2 [(buf.validate.field).repeated.min_items = 1];
}

// A single label/value fact within a [KeyValueList][malonaz.ai.genui.v1.KeyValueList].
message KeyValueListItem {
  // The label naming the fact, e.g. "Budget".
  string label = 1 [(buf.validate.field).required = true];

  // The human-readable value of the fact, e.g. "$10-15k".
  string value = 2;

  // Optional resource name; the client links the value when set.
  string resource_name = 3 [(google.api.resource_reference).type = "*"];
}

// Ordered events, e.g. "what happened with this contact this week".
message Timeline {
  // Optional heading rendered above the entries.
  string title = 1;

  // The events to render, in chronological order.
  repeated TimelineEntry entries = 2 [(buf.validate.field).repeated.min_items = 1];
}

// A single event within a [Timeline][malonaz.ai.genui.v1.Timeline].
message TimelineEntry {
  // Short headline describing what happened.
  string title = 1 [(buf.validate.field).required = true];

  // Optional detail expanding on the title.
  string description = 2;

  // When the event happened.
  google.protobuf.Timestamp time = 3;

  // Optional resource the entry refers to; the client links the entry when set.
  string resource_name = 4 [(google.api.resource_reference).type = "*"];
}

// Minimal chart for aggregates ("calls per day this week").
message Chart {
  // How the points are plotted.
  ChartType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Optional heading rendered above the chart.
  string title = 2;

  // The datapoints to plot, in display order.
  repeated ChartPoint points = 3 [(buf.validate.field).repeated.min_items = 1];
}

// How the points of a [Chart][malonaz.ai.genui.v1.Chart] are plotted.
enum ChartType {
  // Used to detect an unset field.
  CHART_TYPE_UNSPECIFIED = 0;

  // Vertical bars, one per point. Best for comparing categories.
  CHART_TYPE_BAR = 1;

  // A line connecting the points. Best for trends over time.
  CHART_TYPE_LINE = 2;

  // Pie slices sized by value. Best for parts of a whole.
  CHART_TYPE_PIE = 3;
}

// A single datapoint within a [Chart][malonaz.ai.genui.v1.Chart].
message ChartPoint {
  // The category or time bucket this point belongs to.
  string label = 1 [(buf.validate.field).required = true];

  // The measured value for this point.
  double value = 2;
}

// Tabular data, e.g. "quotes by state with count and total value".
message Table {
  // Optional heading rendered above the table.
  string title = 1;

  // Column headers, defining the width of every row.
  repeated string columns = 2 [(buf.validate.field).repeated.min_items = 1];

  // Rows, in display order. Each row carries one cell per column.
  repeated TableRow rows = 3 [(buf.validate.field).repeated.min_items = 1];
}

// A single row within a [Table][malonaz.ai.genui.v1.Table].
message TableRow {
  // Cell values, one per column, in column order.
  repeated TableCell cells = 1 [(buf.validate.field).repeated.min_items = 1];
}

// A single cell within a [TableRow][malonaz.ai.genui.v1.TableRow].
message TableCell {
  // The human-readable value of the cell.
  string value = 1;

  // Optional resource name; the client links the cell when set.
  string resource_name = 2 [(google.api.resource_reference).type = "*"];
}

// Buttons the user can press — pure client affordances that never feed back
// into the model. Navigation, clipboard, and external links execute entirely
// client-side: an ActionRow does not end the agentic turn and expects no
// answer. To offer suggested next steps that the model must hear about, use
// [Choice][malonaz.ai.genui.v1.Choice] instead.
message ActionRow {
  // The buttons to render, in display order.
  repeated ActionRowAction actions = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
  }];
}

// A single button within an [ActionRow][malonaz.ai.genui.v1.ActionRow].
message ActionRowAction {
  // The text rendered on the button.
  string label = 1 [(buf.validate.field).required = true];

  // How the button is visually emphasized.
  ActionStyle style = 2 [(buf.validate.field).enum.defined_only = true];

  // What pressing the button does.
  oneof action {
    option (buf.validate.oneof).required = true;

    // Navigate to this resource in-app.
    string open_resource = 3 [(google.api.resource_reference).type = "*"];

    // Copy this text to the user's clipboard.
    string copy_text = 4;

    // Open this http(s) URL externally.
    string open_url = 5 [(buf.validate.field).string.uri = true];
  }
}

// How an [ActionRowAction][malonaz.ai.genui.v1.ActionRowAction] is
// visually emphasized.
enum ActionStyle {
  // Used to detect an unset field. Rendered as the default style.
  ACTION_STYLE_UNSPECIFIED = 0;

  // The main call to action; at most one per row.
  ACTION_STYLE_PRIMARY = 1;

  // A destructive or irreversible action.
  ACTION_STYLE_DESTRUCTIVE = 2;
}
