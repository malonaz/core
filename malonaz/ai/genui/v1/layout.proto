syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// Groups previously emitted components under a header. Children are
// referenced by component id rather than nested inline, so the model emits
// leaf components first (each rendering as it streams) and then groups them
// — and each tool's schema stays flat.
message Card {
  // The header rendered at the top of the card.
  string title = 1 [(buf.validate.field).required = true];

  // Optional secondary line rendered under the title.
  string subtitle = 2;

  // Ids of previously emitted components, in render order. The client
  // re-parents them into this card.
  repeated string component_ids = 3 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}
