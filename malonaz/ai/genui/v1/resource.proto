syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// A rich card for one resource (contact, quote revision, intent, call…).
// The client picks the renderer from the resource type and hydrates from
// its stores — the model supplies at most a headline, never inline data.
message ResourceCard {
  // The resource to render. Its type selects the client-side renderer.
  string resource_name = 1 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).required = true
  ];

  // Optional AI-written headline overriding the default renderer's title.
  string title = 2;

  // Optional fields the user may edit inline on the card; edits flow back
  // as a [ResourceEditResponse][malonaz.ai.genui.v1.ResourceEditResponse].
  google.protobuf.FieldMask editable_fields = 3;
}

// A homogeneous list of resources, rendered as compact rows.
message ResourceList {
  // Optional heading rendered above the rows.
  string title = 1;

  // The resources to render as rows, in display order.
  repeated string resource_names = 2 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// An inline edit of a [ResourceCard][malonaz.ai.genui.v1.ResourceCard] whose
// `editable_fields` mask is set. The server applies the update; the model
// only sees the outcome.
message ResourceEditResponse {
  // The resource that was edited.
  string resource_name = 1 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).required = true
  ];

  // The edited fields, keyed by field mask path.
  google.protobuf.Struct updated_fields = 2 [(buf.validate.field).required = true];
}
