syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";
import "malonaz/ai/genui/v1/content.proto";
import "malonaz/ai/genui/v1/interaction.proto";
import "malonaz/ai/genui/v1/resource.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// Application-side envelope: the server wraps each parsed tool call into a
// Component before streaming it to clients. The AI never sees this type —
// each component message above is exposed to the model as its own tool, so
// the tool name identifies the variant before any field streams.
message Component {
  // Server-assigned identity (typically the tool call id). Re-emitting a
  // component with the same id replaces the prior version in place.
  string id = 1 [(buf.validate.field).required = true];

  // The component to render.
  oneof component {
    option (buf.validate.oneof).required = true;

    // Markdown-subset prose.
    Text text = 2;

    // Label/value facts.
    KeyValueList key_value_list = 3;

    // Ordered events.
    Timeline timeline = 4;

    // A chart of aggregates.
    Chart chart = 5;

    // A rich card for a single resource.
    ResourceCard resource_card = 6;

    // A list of resources rendered as compact rows.
    ResourceList resource_list = 7;

    // Buttons the user can press.
    ActionRow action_row = 8;

    // A question with constrained answers.
    Choice choice = 9;

    // Tabular data.
    Table table = 10;
  }
}
