syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";
import "malonaz/ai/genui/v1/content.proto";
import "malonaz/ai/genui/v1/input.proto";
import "malonaz/ai/genui/v1/resource.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// Application-side envelope: the server wraps each parsed tool call into a
// Component before streaming it to clients. The AI never sees this type —
// each component message is exposed to the model as its own tool, so the
// tool name identifies the variant before any field streams.
//
// Components split into two families:
// - Display (content.proto, resource.proto): rendered and acknowledged;
//   the agentic loop continues.
// - Input (input.proto): ends the turn; the user's answer round-trips as a
//   tool_result carrying an [InputResponse][malonaz.ai.genui.v1.InputResponse].
//
// Components are stream-rendered: clients paint each field as it arrives
// rather than waiting for the whole message. Fields that select a renderer
// (e.g. [Chart.type][malonaz.ai.genui.v1.Chart.type]) or define a layout
// (e.g. [Table.columns][malonaz.ai.genui.v1.Table.columns]) must therefore be
// generated before the fields they govern, otherwise nothing can be drawn
// until the component completes. Such fields document their ordering
// requirement individually.
message Component {
  // The component to render.
  oneof component {
    option (buf.validate.oneof).required = true;

    // ------------------------------ Display ------------------------------

    // Label/value facts.
    KeyValueList key_value_list = 1;

    // Ordered events.
    Timeline timeline = 2;

    // A chart of aggregates.
    Chart chart = 3;

    // Tabular data.
    Table table = 4;

    // A rich card for a single resource.
    ResourceCard resource_card = 5;

    // A list of resources rendered as compact rows.
    ResourceList resource_list = 6;

    // A single headline metric with an optional delta.
    Stat stat = 7;

    // Client-side buttons: navigation, clipboard, external links.
    ActionRow action_row = 9;

    // A hierarchy of related resources rendered as an indented tree.
    ResourceTree resource_tree = 17;

    // ------------------------------- Input -------------------------------

    // A question with constrained answers.
    Choice choice = 10;

    // A question allowing several answers.
    MultiChoice multi_choice = 11;

    // An approve/reject gate for a consequential action.
    Confirmation confirmation = 12;

    // Structured multi-field input.
    Form form = 13;

    // Select one or more resources from candidates.
    ResourcePicker resource_picker = 14;

    // Bounded numeric input.
    Slider slider = 15;

    // A calendar/clock input.
    DateTimePicker date_time_picker = 16;
  }
}
