syntax = "proto3";

package malonaz.ai.genui.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "malonaz/ai/genui/v1/resource.proto";

option go_package = "github.com/malonaz/core/genproto/ai/genui/v1";

// Input components: the subset of genui that collects input *for the model*.
// Rendering one ends the agentic turn — the model must wait for the user's
// answer, which round-trips as a tool_result carrying the canonical JSON
// encoding of [InputResponse][malonaz.ai.genui.v1.InputResponse]. Each
// component is declared next to its response type.
//
// Anything that does not feed back into the model (navigation buttons,
// copy-to-clipboard, suggested next prompts) is a display component and
// lives in content.proto / resource.proto instead.

// Typed answer to an input component. The client sends exactly one response
// per input component; the server appends it to the conversation as a
// tool_result answering the component's tool call.
message InputResponse {
  // The id of the component's tool call this responds to.
  string component_id = 1 [(buf.validate.field).required = true];

  // The typed payload matching the component's variant.
  oneof response {
    option (buf.validate.oneof).required = true;

    // An answered [Choice][malonaz.ai.genui.v1.Choice].
    ChoiceResponse choice = 2;

    // An answered [MultiChoice][malonaz.ai.genui.v1.MultiChoice].
    MultiChoiceResponse multi_choice = 3;

    // A resolved [Confirmation][malonaz.ai.genui.v1.Confirmation].
    ConfirmationResponse confirmation = 4;

    // A submitted [Form][malonaz.ai.genui.v1.Form].
    FormResponse form = 5;

    // A resolved [ResourcePicker][malonaz.ai.genui.v1.ResourcePicker].
    ResourcePickerResponse resource_picker = 6;

    // A picked [Slider][malonaz.ai.genui.v1.Slider] value.
    SliderResponse slider = 7;

    // A picked [DateTimePicker][malonaz.ai.genui.v1.DateTimePicker] moment.
    DateTimePickerResponse date_time_picker = 8;

    // An inline edit of a [ResourceCard][malonaz.ai.genui.v1.ResourceCard].
    ResourceEditResponse resource_edit = 9;
  }
}

// A question with constrained answers, e.g. disambiguation
// ("which John did you mean?").
message Choice {
  // The question posed to the user.
  string question = 1 [(buf.validate.field).required = true];

  // The answers the user may pick from, in display order.
  repeated string options = 2 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 8
  }];
}

// The answer the user picked within a [Choice][malonaz.ai.genui.v1.Choice].
message ChoiceResponse {
  // The selected option, verbatim.
  string option = 1 [(buf.validate.field).required = true];
}

// A question allowing several answers to be selected before submitting,
// e.g. "which contacts should I include in the follow-up?".
message MultiChoice {
  // The question posed to the user.
  string question = 1 [(buf.validate.field).required = true];

  // The answers the user may pick from, in display order.
  repeated string options = 2 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 12
  }];

  // Minimum number of selections required to submit. Defaults to 1.
  int32 min_selections = 3 [(buf.validate.field).int32.gte = 0];

  // Maximum number of selections allowed. 0 means unlimited.
  int32 max_selections = 4 [(buf.validate.field).int32.gte = 0];
}

// The answers the user picked within a [MultiChoice][malonaz.ai.genui.v1.MultiChoice].
message MultiChoiceResponse {
  // The selected options, verbatim, in display order.
  repeated string options = 1 [(buf.validate.field).repeated.min_items = 1];
}

// An explicit approve/reject gate for a consequential action (send quote,
// delete contact).
message Confirmation {
  // Short headline describing the action awaiting approval.
  string title = 1 [(buf.validate.field).required = true];

  // Optional detail describing the consequences of confirming.
  string description = 2;

  // Optional label for the confirm button. Defaults to "Confirm".
  string confirm_label = 3;

  // Optional label for the cancel button. Defaults to "Cancel".
  string cancel_label = 4;

  // Whether confirming is destructive or irreversible; clients render
  // the confirm button accordingly.
  bool destructive = 5;
}

// The user's verdict on a [Confirmation][malonaz.ai.genui.v1.Confirmation].
message ConfirmationResponse {
  // Whether the user approved the action.
  bool confirmed = 1;
}

// Structured multi-field input submitted as a single
// [FormResponse][malonaz.ai.genui.v1.FormResponse], e.g. capturing a new
// lead's details in one step instead of a free-text back-and-forth.
message Form {
  // Optional heading rendered above the fields.
  string title = 1;

  // Optional label for the submit button. Defaults to "Submit".
  string submit_label = 2;

  // The inputs to render, in display order.
  repeated FormField fields = 3 [(buf.validate.field).repeated.min_items = 1];
}

// The values the user submitted for a [Form][malonaz.ai.genui.v1.Form].
message FormResponse {
  // One value per filled field.
  repeated FormFieldValue values = 1 [(buf.validate.field).repeated.min_items = 1];
}

// A single input within a [Form][malonaz.ai.genui.v1.Form].
message FormField {
  // Identifies the field within its form; echoed back in the
  // [FormFieldValue][malonaz.ai.genui.v1.FormFieldValue].
  string id = 1 [(buf.validate.field).required = true];

  // The label naming the input, e.g. "Budget".
  string label = 2 [(buf.validate.field).required = true];

  // Optional hint rendered inside the empty input.
  string placeholder = 3;

  // Whether the field must be filled before submitting.
  bool required = 4;

  // The kind of input to render.
  oneof input {
    option (buf.validate.oneof).required = true;

    // Free text.
    FormTextInput text = 5;

    // A number, optionally bounded.
    FormNumberInput number = 6;

    // One option from a fixed set.
    FormSelectInput select = 7;

    // A date, optionally with a time of day.
    FormDateInput date = 8;

    // An on/off switch.
    FormToggleInput toggle = 9;
  }
}

// The submitted value of a single [FormField][malonaz.ai.genui.v1.FormField].
message FormFieldValue {
  // The id of the [FormField][malonaz.ai.genui.v1.FormField] this value fills.
  string field_id = 1 [(buf.validate.field).required = true];

  // The value, typed to match the field's input kind.
  oneof value {
    option (buf.validate.oneof).required = true;

    // Fills a [FormTextInput][malonaz.ai.genui.v1.FormTextInput].
    string text = 2;

    // Fills a [FormNumberInput][malonaz.ai.genui.v1.FormNumberInput].
    double number = 3;

    // Fills a [FormSelectInput][malonaz.ai.genui.v1.FormSelectInput].
    string selected_option = 4;

    // Fills a [FormDateInput][malonaz.ai.genui.v1.FormDateInput].
    google.protobuf.Timestamp date = 5;

    // Fills a [FormToggleInput][malonaz.ai.genui.v1.FormToggleInput].
    bool toggle = 6;
  }
}

// A free-text input within a [FormField][malonaz.ai.genui.v1.FormField].
message FormTextInput {
  // Whether to render a multi-line text area instead of a single line.
  bool multiline = 1;
}

// A numeric input within a [FormField][malonaz.ai.genui.v1.FormField].
message FormNumberInput {
  // Optional inclusive lower bound.
  optional double min = 1;

  // Optional inclusive upper bound.
  optional double max = 2;
}

// A single-select input within a [FormField][malonaz.ai.genui.v1.FormField].
message FormSelectInput {
  // The options the user may pick from, in display order.
  repeated string options = 1 [(buf.validate.field).repeated.min_items = 2];
}

// A date input within a [FormField][malonaz.ai.genui.v1.FormField].
message FormDateInput {
  // Whether the user also picks a time of day.
  bool include_time = 1;
}

// An on/off input within a [FormField][malonaz.ai.genui.v1.FormField].
message FormToggleInput {
  // The initial state of the toggle.
  bool default_value = 1;
}

// Select one or more resources from a candidate set, e.g. disambiguating
// "which John did you mean?". The client renders each candidate using the
// same hydration as [ResourceList][malonaz.ai.genui.v1.ResourceList].
message ResourcePicker {
  // Optional heading rendered above the candidates.
  string title = 1;

  // The candidate resources, in display order.
  repeated string resource_names = 2 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  // Whether the user may select more than one candidate.
  bool multi_select = 3;
}

// The candidates the user picked within a [ResourcePicker][malonaz.ai.genui.v1.ResourcePicker].
message ResourcePickerResponse {
  // The selected resources, in display order.
  repeated string resource_names = 1 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// Bounded numeric input, e.g. "how satisfied was the customer, 1-5?".
message Slider {
  // The label naming the value being picked.
  string label = 1 [(buf.validate.field).required = true];

  // The inclusive lower bound.
  double min = 2;

  // The inclusive upper bound.
  double max = 3;

  // The increment between selectable values. 0 means continuous.
  double step = 4 [(buf.validate.field).double.gte = 0];
}

// The value the user picked on a [Slider][malonaz.ai.genui.v1.Slider].
message SliderResponse {
  // The selected value.
  double value = 1;
}

// A calendar/clock input, e.g. "when should I schedule the call?".
message DateTimePicker {
  // The label naming the moment being picked.
  string label = 1 [(buf.validate.field).required = true];

  // Whether the user also picks a time of day.
  bool include_time = 2;

  // Optional earliest selectable moment.
  google.protobuf.Timestamp min_time = 3;

  // Optional latest selectable moment.
  google.protobuf.Timestamp max_time = 4;
}

// The moment the user picked on a [DateTimePicker][malonaz.ai.genui.v1.DateTimePicker].
message DateTimePickerResponse {
  // The selected moment.
  google.protobuf.Timestamp time = 1 [(buf.validate.field).required = true];
}
