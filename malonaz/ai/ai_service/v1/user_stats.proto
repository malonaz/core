syntax = "proto3";

package malonaz.ai.ai_service.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/interval.proto";
import "malonaz/ai/v1/user_stats.proto";

option go_package = "github.com/malonaz/core/genproto/ai/ai_service/v1";

// Request message for AiService.ComputeUserStats.
message ComputeUserStatsRequest {
  // The parent user to compute stats for. Wildcards ("-") are supported to
  // aggregate across all users of an organization, or across all
  // organizations.
  // Format: organizations/{organization}/users/{user}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "ai.malonaz.com/UserStats"
  ];

  // The interval to compute stats over. Unset means all time.
  google.type.Interval interval = 2;

  // The bucket granularity for time-series stats. Unset means totals only.
  ai.v1.UserStatsGranularity granularity = 3 [(buf.validate.field).enum.defined_only = true];
}
