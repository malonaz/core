syntax = "proto3";

package malonaz.ai.ai_service.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "malonaz/ai/v1/metrics.proto";
import "malonaz/audio/v1/audio.proto";

option go_package = "github.com/malonaz/core/genproto/ai/ai_service/v1";

// Configuration for text to speech generation.
message TextToSpeechConfiguration {
  // Optional language code to improve accuracy (e.g., "en", "es").
  string language_code = 1;

  // Preferred sample rate.e.g., 16000, 44100, 48000
  // Best effort basis, caller should inspect the `audio_format` output.
  int32 preferred_sample_rate = 2;

  // Override provider-specific request fields.
  // See provider documentation for supported settings.
  // Any field here gets injected into the request to the provider at the root level.
  google.protobuf.Struct provider_settings = 3;
}

// Request message for AiService.TextToSpeech.
message TextToSpeechRequest {
  // The resource name of the model used.
  // Format: providers/{provider}/models/{model}
  string model = 1 [
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (buf.validate.field).required = true
  ];

  // Voice selection.
  oneof voice_selection {
    option (buf.validate.oneof).required = true;

    // The resource name of the voice to use.
    // Format: voices/{voice}
    string voice = 2 [
      (google.api.resource_reference).type = "ai.malonaz.com/Voice",
      (buf.validate.field).string.min_len = 1
    ];

    // The provider voice id.
    string provider_voice_id = 3 [(buf.validate.field).string.min_len = 1];
  }

  // The text to convert to speech.
  string text = 4 [(buf.validate.field).string.min_len = 1];

  // Additional configuration.
  TextToSpeechConfiguration configuration = 5;
}

// Response message for AiService.TextToSpeech.
message TextToSpeechResponse {
  // Audio format of the audio.
  audio.v1.Format audio_format = 1;

  // Audio data chunk in PCM16 format.
  audio.v1.Chunk audio_chunk = 2;

  // Model usage metrics.
  .malonaz.ai.v1.ModelUsage model_usage = 3;

  // Generation metrics.
  .malonaz.ai.v1.GenerationMetrics generation_metrics = 4;
}

// Request message for AiService.TextToSpeechStream.
message TextToSpeechStreamRequest {
  // The resource name of the model to use.
  // Format: providers/{provider}/models/{model}
  string model = 1 [
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (buf.validate.field).required = true
  ];

  // Voice selection.
  oneof voice_selection {
    option (buf.validate.oneof).required = true;

    // The resource name of the voice to use.
    // Format: voices/{voice}
    string voice = 2 [
      (google.api.resource_reference).type = "ai.malonaz.com/Voice",
      (buf.validate.field).string.min_len = 1
    ];

    // The provider voice id.
    string provider_voice_id = 3 [(buf.validate.field).string.min_len = 1];
  }

  // The text to convert to speech.
  string text = 4 [(buf.validate.field).string.min_len = 1];

  // Additional configuration.
  TextToSpeechConfiguration configuration = 5;
}

// Response message for AiService.TextToSpeechStream.
message TextToSpeechStreamResponse {
  // Content of this response.
  oneof content {
    option (buf.validate.oneof).required = true;

    // Audio format of the audio stream.
    audio.v1.Format audio_format = 1;

    // Audio data chunk in PCM16 format.
    audio.v1.Chunk audio_chunk = 2;

    // Model usage event (sent last).
    .malonaz.ai.v1.ModelUsage model_usage = 3;

    // Generation metrics.
    .malonaz.ai.v1.GenerationMetrics generation_metrics = 4;
  }
}

// Request message for AiService.StreamTextToSpeech.
message StreamTextToSpeechRequest {
  // Content of this request.
  oneof content {
    option (buf.validate.oneof).required = true;

    // Configuration for the stream. Must be sent first.
    StreamTextToSpeechConfiguration configuration = 1;

    // Incremental text for the current turn (e.g. LLM tokens as they are
    // generated). The provider may begin synthesizing before the turn is
    // flushed.
    string text = 2;

    // Marks the end of the current turn's text, forcing synthesis of any
    // buffered input. A new turn may be started by sending more text.
    StreamTextToSpeechFlush flush = 3;

    // Interrupts the current turn: the provider stops synthesizing and
    // reports what was actually spoken via turn_interrupted.
    StreamTextToSpeechInterrupt interrupt = 4;
  }
}

// Configuration for text-to-speech streaming. Sent as the first message.
message StreamTextToSpeechConfiguration {
  // The resource name of the model used.
  // Format: providers/{provider}/models/{model}
  string model = 1 [
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (buf.validate.field).required = true
  ];

  // Voice selection.
  oneof voice_selection {
    option (buf.validate.oneof).required = true;

    // The resource name of the voice to use.
    // Format: voices/{voice}
    string voice = 2 [
      (google.api.resource_reference).type = "ai.malonaz.com/Voice",
      (buf.validate.field).string.min_len = 1
    ];

    // The provider voice id.
    string provider_voice_id = 3 [(buf.validate.field).string.min_len = 1];
  }

  // Additional configuration.
  TextToSpeechConfiguration configuration = 4;
}

// Marks the end of the current turn's text.
message StreamTextToSpeechFlush {}

// Interrupts the current turn (e.g. the listener barged in).
message StreamTextToSpeechInterrupt {}

// Reports the outcome of an interrupted turn.
message StreamTextToSpeechTurnInterrupted {
  // The portion of the turn's text that was spoken before the interruption.
  string text_spoken = 1;

  // The portion of the turn's text that was never synthesized.
  string text_remaining = 2;
}

// Indicates a turn's text has been fully synthesized.
message StreamTextToSpeechTurnComplete {
  // Total audio duration produced for this turn.
  google.protobuf.Duration audio_duration = 1;

  // Billable character count for this turn.
  int32 billable_character_count = 2;
}

// Response message for AiService.StreamTextToSpeech.
message StreamTextToSpeechResponse {
  // Content of this response.
  oneof content {
    option (buf.validate.oneof).required = true;

    // Audio format of the audio stream (sent first).
    audio.v1.Format audio_format = 1;

    // Audio data chunk in PCM16 format.
    audio.v1.Chunk audio_chunk = 2;

    // Indicates the current turn's text has been fully synthesized. Emitted
    // after the last audio chunk of a flushed turn.
    StreamTextToSpeechTurnComplete turn_complete = 3;

    // Indicates the current turn was interrupted. Emitted instead of
    // turn_complete after an interrupt request.
    StreamTextToSpeechTurnInterrupted turn_interrupted = 6;

    // Model usage event (sent at the end of the stream).
    .malonaz.ai.v1.ModelUsage model_usage = 4;

    // Generation metrics (sent at the end of the stream).
    .malonaz.ai.v1.GenerationMetrics generation_metrics = 5;
  }
}
