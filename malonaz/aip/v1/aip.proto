syntax = "proto3";

package malonaz.aip.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/malonaz/core/genproto/aip/v1";

// Type of resource event.
enum ResourceEventType {
  // Used to detect an unset field.
  RESOURCE_EVENT_TYPE_UNSPECIFIED = 0;
  // A resource was created.
  RESOURCE_EVENT_TYPE_CREATED = 1;
  // A resource was updated.
  RESOURCE_EVENT_TYPE_UPDATED = 2;
  // A resource was deleted.
  RESOURCE_EVENT_TYPE_DELETED = 3;
}

// A resource lifecycle event.
message ResourceEvent {
  option (buf.validate.message).cel = {
    id: "updated_event_requires_previous_resource_and_update_mask"
    expression: "this.type != 2 || (has(this.previous_resource) && has(this.update_mask))"
    message: "previous_resource and update_mask must be set when type is RESOURCE_EVENT_TYPE_UPDATED"
  };

  // The type of event.
  string name = 1 [
    (google.api.resource_reference).type = "*",
    (buf.validate.field).required = true
  ];

  // The type of event.
  ResourceEventType type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The resource after the event.
  google.protobuf.Any resource = 3;
  // The resource before the event. Only set for RESOURCE_EVENT_TYPE_UPDATED.
  google.protobuf.Any previous_resource = 4;
  // The field mask of updated fields. Only set for RESOURCE_EVENT_TYPE_UPDATED.
  google.protobuf.FieldMask update_mask = 5;
}

// A search-result snippet: highlighted fragments of the fields that matched a
// search query. Search responses carry one SearchSnippet per returned
// resource, index-aligned with the resource list; resources without a
// highlighted fragment carry an empty snippet.
message SearchSnippet {
  // The matched fragments, ordered by the field's search weight (A first).
  repeated SearchSnippetMatch matches = 1;
}

// One highlighted fragment of a field that matched a search query.
message SearchSnippetMatch {
  // The resource field path that matched, e.g. "biography" or "metadata.country".
  string path = 1;
  // The highlighted fragment; matches are wrapped in ** markers.
  string match = 2;
}
