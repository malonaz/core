syntax = "proto3";

package malonaz.onyx.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/malonaz/core/genproto/onyx/v1";

// A Go service: the library onyx wires from its dependencies and generated servers.
message ServiceManifest {
  // Kebab-case. The flag namespace, environment prefix and internal service account of the service.
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"];

  // Please label of the Go package implementing the service.
  string target = 2 [(buf.validate.field).string.min_len = 1];

  // Generate an empty Opts, runtime and start(), so the package need not define them.
  bool include_runtime = 3;

  // Export the Service struct's fields, for packages embedding it from elsewhere.
  bool export_service_fields = 4;

  // Generated servers the Service embeds.
  repeated Codegen codegens = 5;

  // Constructor arguments, in order. Resolved by the binary hosting the service.
  repeated Dependency dependencies = 6;
}

// A generated component the Service embeds.
message Codegen {
  // Which generator.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A gRPC server generated by protoc-gen-core's rpc plugin.
    Rpc rpc = 1;
  }

  // A gRPC server generated by protoc-gen-core's rpc plugin over a store.
  message Rpc {
    // Kebab-case name of the proto service.
    string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"];

    // The postgres_db_client dependency backing it.
    string store = 2 [(buf.validate.field).string.pattern = "^[a-z0-9_-]+$"];

    // Please label of the generated rpc package.
    string target = 3 [(buf.validate.field).string.min_len = 1];

    // Publishes NATS events; requires a nats dependency.
    bool nats = 4;

    // Returns google.longrunning.Operation from some methods; requires a grpc_client dependency on
    // scheduler-service.
    bool longrunning = 5;
  }
}

// A constructor argument of the service.
message Dependency {
  // Which kind.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A gRPC client.
    GrpcClient grpc_client = 1;

    // A generated store over a postgres database.
    PostgresDbClient postgres_db_client = 2;

    // A raw postgres client.
    PostgresClient postgres_client = 3;

    // The NATS client.
    Nats nats = 4;

    // A plain Go component.
    Service service = 5;
  }

  // A gRPC client. Dialed through the hosting server's own opts when the binary serves the service,
  // through its own `{service}-grpc` client flags otherwise.
  message GrpcClient {
    // Please label of the proto library declaring the service.
    string proto = 1 [(buf.validate.field).string.min_len = 1];

    // Kebab-case name of the proto service.
    string service = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"];

    // Kebab-case name of the client: the constructor argument and, for a remote client, its
    // `{name}-grpc` flags. Defaults to service; set it when a binary hosts two services of the
    // same name on different protos.
    string name = 3 [
      (buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$",
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];

    // Also inject the `google.longrunning.Operations` client of the server serving the service,
    // on the same connection, as `{name}OperationsClient`: how a caller waits on the operations
    // the service's long-running methods return. The service must have such methods.
    bool operations = 4;
  }

  // A generated store over a postgres database.
  message PostgresDbClient {
    // Name of the store; the constructor argument.
    string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9_-]+$"];

    // Database it lives in, configured by the `{database}-postgres` flags. Defaults to name.
    string database = 2 [
      (buf.validate.field).string.pattern = "^[a-z0-9_-]+$",
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];

    // Please label of the generated store package.
    string target = 3 [(buf.validate.field).string.min_len = 1];
  }

  // A raw postgres client.
  message PostgresClient {
    // Name of the client; the constructor argument.
    string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9_-]+$"];

    // Database it connects to, configured by the `{database}-postgres` flags. Defaults to name.
    string database = 2 [
      (buf.validate.field).string.pattern = "^[a-z0-9_-]+$",
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];
  }

  // The NATS client.
  message Nats {}

  // A plain Go component built from its own Opts and shared by every service in the binary.
  message Service {
    // Kebab-case name; the `{name}-service` flag namespace.
    string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"];

    // Please label of the Go package implementing it.
    string target = 2 [(buf.validate.field).string.min_len = 1];
  }
}
