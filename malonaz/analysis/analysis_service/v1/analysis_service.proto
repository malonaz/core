syntax = "proto3";

package malonaz.analysis.analysis_service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "malonaz/analysis/v1/analysis.proto";
import "malonaz/analysis/v1/result.proto";

option go_package = "github.com/malonaz/core/genproto/analysis/analysis_service/v1";

// The AnalysisService lists the analyses a binary hosts, and generates and lists
// their results.
service AnalysisService {
  option (google.api.default_host) = "analysis.malonaz.com";

  // ===================== Analysis Management =====================

  // Get an analysis.
  //
  // See: https://google.aip.dev/131 (Standard methods: Get).
  rpc GetAnalysis(GetAnalysisRequest) returns (malonaz.analysis.v1.Analysis) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{name=services/*/types/*/analyses/*}"};
    option (google.api.method_signature) = "name";
  }

  // List the analyses this service hosts for a resource type. Use `-` for the
  // service and type to list across all of them.
  //
  // See: https://google.aip.dev/132 (Standard methods: List), https://google.aip.dev/159 (Reading across collections).
  rpc ListAnalyses(ListAnalysesRequest) returns (ListAnalysesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{parent=services/*/types/*}/analyses"};
    option (google.api.method_signature) = "parent";
  }

  // ===================== Result Management =====================

  // Generate the results of analyses on a resource, and return them. `-` for the
  // analysis runs every analysis of the type that applies to the resource, one judge
  // call per view and model. A current result (a fresh render has the same
  // prompt etag) is returned without calling the model; the others are judged,
  // recorded and returned. A named analysis runs whether it applies or not.
  //
  // See: https://google.aip.dev/136 (Custom methods).
  rpc GenerateResults(GenerateResultsRequest) returns (GenerateResultsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=services/*/types/*/analyses/*}/results:generate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,resource";
  }

  // List the results of an analysis. The filter must restrict `resource`; use `-`
  // for the analysis to list every analysis's results on those resources. Never
  // calls a model.
  //
  // See: https://google.aip.dev/132 (Standard methods: List), https://google.aip.dev/159 (Reading across collections).
  rpc ListResults(ListResultsRequest) returns (ListResultsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/{parent=services/*/types/*/analyses/*}/results"};
    option (google.api.method_signature) = "parent";
  }
}

// Request message for AnalysisService.GetAnalysis.
message GetAnalysisRequest {
  // The resource name of the analysis to retrieve.
  // Format: services/{service}/types/{resource_type}/analyses/{analysis}
  string name = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "analysis.malonaz.com/Analysis"
  ];
}

// Request message for AnalysisService.ListAnalyses.
message ListAnalysesRequest {
  // The resource type whose analyses to list. `-` for the service and type lists
  // across all of them.
  // Format: services/{service}/types/{resource_type}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "analysis.malonaz.com/Analysis"
  ];

  // The maximum number of analyses to return. The server may return fewer.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // A page token, received from a previous `ListAnalyses` call.
  string page_token = 3;
}

// Response message for AnalysisService.ListAnalyses.
message ListAnalysesResponse {
  // The analyses.
  repeated malonaz.analysis.v1.Analysis analyses = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for AnalysisService.GenerateResults.
message GenerateResultsRequest {
  // The analysis to generate the result of. `-` for the analysis runs every
  // analysis of the type, or those named in `analyses`.
  // Format: services/{service}/types/{resource_type}/analyses/{analysis}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "analysis.malonaz.com/Analysis"
  ];

  // The resource to analyse, of the analyses' resource type.
  string resource = 2 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "*"
  ];

  // With `-` for the analysis, the ids of the analyses to run. Empty runs all of them.
  repeated string analyses = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
  }];
}

// Response message for AnalysisService.GenerateResults.
message GenerateResultsResponse {
  // The results, one per analysis run. An analysis that failed has no entry.
  repeated malonaz.analysis.v1.Result results = 1;
}

// Request message for AnalysisService.ListResults.
message ListResultsRequest {
  // The analysis whose results to list. `-` for the analysis lists every
  // analysis of the type.
  // Format: services/{service}/types/{resource_type}/analyses/{analysis}
  string parent = 1 [
    (buf.validate.field).required = true,
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "analysis.malonaz.com/Result"
  ];

  // AIP-160 filter. Must restrict `resource` with `=`, alone or OR'd, up to 100
  // resources, e.g. `resource = "organizations/o/users/u/chats/c"`.
  string filter = 2 [(buf.validate.field).required = true];

  // The maximum number of results to return. The server may return fewer.
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // A page token, received from a previous `ListResults` call.
  string page_token = 4;
}

// Response message for AnalysisService.ListResults.
message ListResultsResponse {
  // The results. An analysis that has not run on a resource has no entry.
  repeated malonaz.analysis.v1.Result results = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}
