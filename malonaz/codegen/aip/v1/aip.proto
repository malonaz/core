syntax = "proto3";

package malonaz.codegen.aip.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/malonaz/core/genproto/codegen/aip/v1";

// Extension for method options to mark methods as standard AIP methods (Create, Get, Update, Delete, List).
extend google.protobuf.MethodOptions {
  // Extension for standard method.
  StandardMethod standard_method = 93000;
}

// Extensions for message options to configure AIP list and update behaviors.
extend google.protobuf.MessageOptions {
  //  The uuid namespace for a resource.
  string uuid_namespace = 92000;

  // Configuration for AIP Update RPCs, including field mask handling and authorization.
  UpdateOptions update = 920013;

  // Option for pagination.
  PaginationOptions pagination = 94000;
  // Option for ordering.
  OrderingOptions ordering = 94001;
  // Option for ordering.
  FilteringOptions filtering = 94002;
  // Option for search. Set on a resource message to make it searchable.
  SearchOptions search = 94003;
}

// Options for filtering.
message FilteringOptions {
  // List of fields that can be used in the filter expression.
  // Can use * or some.path.* wildcards.
  repeated string paths = 1;
}

// Options for search. Declares the fields composing a resource's search
// document, along with their relevance weight and tokenization behavior.
// The postgres codegen derives the search document SQL expression from these
// fields, and the rpc codegen wires Search{Plural} methods against it.
message SearchOptions {
  // Relevance weight of a field, mapping to postgres tsvector weights.
  // A is the highest relevance, D the lowest.
  enum Weight {
    // Used to detect an unset field. Defaults to WEIGHT_D.
    WEIGHT_UNSPECIFIED = 0;
    // Highest relevance.
    WEIGHT_A = 1;
    // High relevance.
    WEIGHT_B = 2;
    // Medium relevance.
    WEIGHT_C = 3;
    // Lowest relevance.
    WEIGHT_D = 4;
  }

  // Tokenization behavior applied to a field on top of standard word splitting.
  enum Split {
    // Used to detect an unset field. No extra tokenization.
    SPLIT_UNSPECIFIED = 0;
    // Splits email addresses into their components, e.g.
    // "john@gmail.com" also indexes "john", "gmail" and "com".
    SPLIT_EMAIL_ADDRESS = 1;
    // Strips all non-digit characters, e.g. "+1 (415) 555-1234"
    // also indexes "14155551234".
    SPLIT_PHONE_NUMBER = 2;
  }

  // A field contributing to the search document.
  message Field {
    // The top-level field of the resource. Must be a string or repeated string field.
    string path = 1 [(buf.validate.field).required = true];
    // The relevance weight of this field. Defaults to WEIGHT_D.
    Weight weight = 2 [(buf.validate.field).enum.defined_only = true];
    // Extra tokenization applied to this field.
    Split split = 3 [(buf.validate.field).enum.defined_only = true];
    // If true, matches in this field produce a highlighted snippet in Search
    // responses (via ts_headline). The Search response message must declare a
    // `repeated malonaz.aip.v1.SearchSnippet snippets` field, index-aligned with
    // the resource list.
    bool snippet = 4;
  }

  // The fields composing the search document.
  repeated Field fields = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Options for pagination.
message PaginationOptions {
  // The default number of items to return per page.
  int32 default_page_size = 1 [(buf.validate.field).int32.gt = 0];
}

// Options for ordering.
message OrderingOptions {
  // List of fields that can be used in the filter expression.
  // Can use * or some.path.* wildcards.
  repeated string paths = 1 [(buf.validate.field).required = true];
  // The default ordering by option.
  string default = 2 [(buf.validate.field).required = true];
}

// Configuration options for AIP-compliant Update methods.
// Defines which fields can be updated and how field masks are processed.
message UpdateOptions {
  // List of field paths that users are authorized to update.
  // Only fields listed here (or matching wildcard patterns) can be modified via Update RPCs.
  // This provides fine-grained access control at the field level.
  repeated string paths = 1;
}

// Marks a method as a standard AIP method (Create, Get, Update, Delete, or List).
// The protoc-gen-api plugin uses this to generate appropriate server and client code.
message StandardMethod {
  // The resource type this method operates on (e.g., "example.com/User").
  // Must match a resource type defined in google.api.resource annotations.
  // Used to determine request/response message types and validate method naming.
  string resource = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+\\.[a-z]+\\.[a-z0-9]+/[A-Z][a-zA-Z]*$"
  ];
  // Emit an event for this action, using github.com/malonaz/pgq.
  // Only supported on CREATE, UPDATE & DELETE methods.
  bool emit_event = 2;
}
