syntax = "proto3";

package malonaz.codegen.nats.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "malonaz/nats/v1/stream.proto";

option go_package = "github.com/malonaz/core/genproto/codegen/nats/v1";

// Extension to annotate a protobuf service with NATS stream generation options.
// When set, the code generator emits a NATS JetStream stream configuration
// for all resources defined in the service.
extend google.protobuf.ServiceOptions {
  // Stream options for resources in this service.
  repeated malonaz.nats.v1.StreamOptions stream = 74000;
}

// Extension to annotate a protobuf resource message with NATS event generation options.
// When set, the code generator emits typed NATS JetStream event messages
// for the specified standard AIP methods (create, update, delete).
extend google.protobuf.MessageOptions {
  // Event generation options for this resource.
  EventOptions event = 74001;
}

// Extension marking the RPC that delivers journaled resource events.
// A service whose resources opt into the outbox declares exactly one such
// method; the code generator implements it, and the scheduler delivers each
// journaled event to it.
extend google.protobuf.MethodOptions {
  // Whether this method is the service's outbox delivery endpoint.
  bool outbox = 74002;
}

// Extension to annotate a protobuf resource message with NATS event generation options.
// When set, the code generator emits typed NATS JetStream event messages
// for the specified standard AIP methods (create, update, delete).
message EventOptions {
  // The stream on which events will be published.
  string stream = 1 [(buf.validate.field).required = true];

  // Resource name segments prepended before the event subject token.
  // Each value must match a segment from the resource's name pattern.
  // For example, given pattern "organizations/{organization}/shelves/{shelf}",
  // specifying ["organization"] produces subjects like `<organization_id>.<subject>`.
  // Multiple segments are prepended in order: `<seg1>.<seg2>.<subject>`.
  repeated string resource_segments = 2;

  // Options for created events, published when a resource is created via its Create method.
  // If unset, no created event is generated.
  repeated EventMethodOptions created = 3;

  // Options for updated events, published when a resource is updated via its Update method.
  // If unset, no updated event is generated.
  repeated EventMethodOptions updated = 4;

  // Options for deleted events, published when a resource is deleted via its Delete method.
  // If unset, no deleted event is generated.
  repeated EventMethodOptions deleted = 5;

  // Options for undeleted events, published when a soft-deleted resource is restored via its Undelete method.
  // If unset, no undeleted event is generated.
  repeated EventMethodOptions undeleted = 6;

  // If true, this resource's events are not published inline by the RPC that
  // caused them. They are journaled in the same database transaction as the
  // write, and a relay hands each one to the scheduler, which delivers it to
  // the service's outbox method. That method publishes them, so a committed
  // write and its events can no longer diverge.
  //
  // Requires the service to declare an outbox method; see the `outbox` method
  // extension.
  bool outbox = 7;
}

// Options controlling subject routing and conditional publishing for a single event type.
message EventMethodOptions {
  // The event type token in the subject (e.g., "created", "updated", "deleted").
  string subject = 1 [(buf.validate.field).required = true];

  // Proto fields appended after the subject token.
  // Each value must reference a field on the resource message.
  // For example, specifying ["genre"] produces subjects like
  // `<resource_segments...>.<subject>.<genre_value>`.
  // Multiple fields are appended in order.
  //
  // String fields are used as-is.
  // Enum fields have their type prefix stripped and the remainder is lowercased
  // (e.g., SHELF_GENRE_FICTION -> fiction).
  repeated string subject_fields = 2;

  // Optional CEL expression evaluated before publishing.
  // If present, the event is only published when the expression evaluates to true.
  // Available variables:
  //   - `<resource>` (e.g., `shelf`) on created, updated, deleted & undeleted events.
  //   - `previous_<resource>` (e.g., `previous_shelf`) on updated events.
  //   - `update_mask` on updated events.
  string cel = 3;
}
