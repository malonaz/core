# A local overlay of user-service's generated base: `tools/onyx/k8s/kind/run.sh`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onyx
resources:
  - namespace.yaml
  - deps.yaml
  - ../../../../plz-out/gen/cmd/user-service
images:
  - name: user-service
    newName: onyx-kind/user-service
    newTag: dev
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: user-service
      spec:
        template:
          spec:
            containers:
              - name: user-service
                env:
                  - name: USER_POSTGRES_HOST
                    value: postgres
                  - name: NATS_HOST
                    value: nats
                  - name: USER_SERVICE_EXTERNAL_GRPC_DISABLE_TLS
                    value: "true"
